<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的健康手账</title>
<style>
:root {
  --paper: #FBF6EE; --card: #FFFDF8; --ink: #3E3A33; --ink2: #6B6558; --ink3: #A69E8F;
  --line: #E8DFD0; --accent: #E8734A; --rose: #D94F70; --sage: #7A9B76; --sage-l: #EDF3EC;
  --sky: #6B9BC3; --sky-l: #EBF2F7; --butter: #E5A84B; --butter-l: #FDF3E3;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:"PingFang SC",-apple-system,"Helvetica Neue","Microsoft YaHei",sans-serif; background:var(--paper); color:var(--ink); height:100vh; height:100dvh; overflow:hidden; -webkit-user-select:none; user-select:none; display:flex; flex-direction:column; max-width:480px; margin:0 auto; }
.head { flex-shrink:0; padding:14px 20px 10px; display:flex; justify-content:space-between; align-items:center; }
.h-brand { display:flex; align-items:center; gap:9px; }
.h-logo { width:34px; height:34px; border-radius:10px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:16px; box-shadow:0 3px 10px rgba(232,115,74,0.25); }
.h-title { font-size:15px; font-weight:800; letter-spacing:-0.3px; }
.h-sub { font-size:9px; color:var(--ink3); }
.h-count { font-size:10px; color:var(--ink3); background:var(--card); border:1px solid var(--line); padding:4px 10px; border-radius:12px; }
.stats { flex-shrink:0; display:flex; margin:0 20px 12px; background:var(--card); border:1px solid rgba(232,223,208,0.6); border-radius:14px; overflow:hidden; }
.stat { flex:1; text-align:center; padding:10px 4px; position:relative; }
.stat:not(:last-child)::after { content:""; position:absolute; right:0; top:25%; height:50%; width:1px; background:var(--line); }
.sa-num { font-size:17px; font-weight:800; letter-spacing:-0.4px; }
.sa-num .u { font-size:9px; font-weight:500; color:var(--ink3); }
.sa-num.warn { color:var(--accent); } .sa-num.ok { color:var(--sage); }
.sa-label { font-size:8px; color:var(--ink3); margin-top:2px; letter-spacing:1px; }
.carousel { flex:1; min-height:0; position:relative; overflow:hidden; padding:0 20px; }
.track { display:flex; height:100%; transition:transform .45s cubic-bezier(.32,.72,.32,1); }
.slide { min-width:100%; padding:0 2px; display:flex; flex-direction:column; min-height:0; }
.page-card { background:var(--card); border-radius:4px 20px 20px 20px; border:1px solid rgba(232,223,208,0.6); box-shadow:0 6px 24px rgba(62,58,51,0.07),0 1px 3px rgba(62,58,51,0.04); overflow-y:auto; -webkit-overflow-scrolling:touch; position:relative; flex:1; min-height:0; scrollbar-width:none; }
.page-card::-webkit-scrollbar { display:none; }
.page-card::before { content:""; position:absolute; top:-5px; right:24px; width:56px; height:15px; background:repeating-linear-gradient(45deg,rgba(232,115,74,0.18) 0 4px,rgba(232,115,74,0.10) 4px 8px); border-radius:1px; transform:rotate(3deg); z-index:3; }
.slide:nth-child(2) .page-card::before { background:repeating-linear-gradient(45deg,rgba(107,155,195,0.18) 0 4px,rgba(107,155,195,0.10) 4px 8px); }
.slide:nth-child(3) .page-card::before { background:repeating-linear-gradient(45deg,rgba(122,155,118,0.18) 0 4px,rgba(122,155,118,0.10) 4px 8px); }
.pc-head { position:sticky; top:0; z-index:5; background:rgba(255,253,248,0.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); padding:14px 18px 10px; display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px dashed var(--line); }
.pc-date { font-size:17px; font-weight:800; letter-spacing:-0.3px; }
.pc-week { font-size:10px; color:var(--ink3); margin-top:2px; }
.pc-right { display:flex; align-items:baseline; gap:3px; }
.pc-w { font-size:24px; font-weight:800; letter-spacing:-0.5px; }
.pc-u { font-size:10px; color:var(--ink3); font-weight:500; }
.pc-chg { font-size:9px; font-weight:700; border-radius:8px; padding:3px 7px; margin-left:5px; align-self:center; }
.pc-chg.up { color:var(--accent); background:var(--butter-l); } .pc-chg.down { color:var(--sage); background:var(--sage-l); } .pc-chg.same { color:var(--ink3); background:var(--paper); }
.pc-body { padding:12px 18px 20px; }
.sec { margin-bottom:16px; } .sec:last-child { margin-bottom:0; }
.sec-tag { display:inline-flex; align-items:center; gap:5px; font-size:9px; font-weight:700; letter-spacing:2px; color:var(--ink3); text-transform:uppercase; margin-bottom:10px; }
.sec-tag .st-l { width:14px; height:2px; border-radius:1px; }
.sec-tag.t-w .st-l { background:var(--sky); } .sec-tag.t-d .st-l { background:var(--butter); } .sec-tag.t-a .st-l { background:var(--sage); }
.w-row { display:flex; gap:10px; }
.w-box { flex:1; background:var(--paper); border-radius:12px; padding:11px 8px; text-align:center; border:1px solid rgba(232,223,208,0.5); }
.wb-i { font-size:14px; } .wb-l { font-size:9px; color:var(--ink3); }
.wb-v { font-size:20px; font-weight:800; letter-spacing:-0.5px; margin-top:2px; }
.wb-v .u { font-size:10px; font-weight:400; color:var(--ink3); }
.w-note { margin-top:8px; font-size:10px; color:var(--ink2); background:var(--paper); border-radius:10px; padding:7px 12px; text-align:center; border:1px dashed var(--line); }
.nutri { display:flex; background:var(--paper); border-radius:12px; overflow:hidden; border:1px solid rgba(232,223,208,0.5); margin-bottom:12px; }
.nc { flex:1; text-align:center; padding:10px 4px; position:relative; }
.nc:not(:last-child)::after { content:""; position:absolute; right:0; top:25%; height:50%; width:1px; background:var(--line); }
.n-v { font-size:15px; font-weight:800; letter-spacing:-0.3px; }
.n-v.total { color:var(--accent); font-size:17px; } .n-v.p { color:var(--sky); } .n-v.c { color:var(--butter); } .n-v.f { color:var(--rose); }
.n-l { font-size:8px; color:var(--ink3); margin-top:2px; letter-spacing:1px; }
.meal { display:flex; gap:12px; margin-bottom:12px; } .meal:last-child { margin-bottom:0; }
.m-rail { display:flex; flex-direction:column; align-items:center; width:32px; flex-shrink:0; }
.m-dot { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; border:2px solid var(--card); box-shadow:0 0 0 1.5px var(--line); }
.m-rail .m-ln { flex:1; width:1.5px; background:var(--line); margin-top:3px; }
.m-dot.morning { background:var(--butter-l); } .m-dot.noon { background:var(--sky-l); } .m-dot.snack { background:var(--rose-l); } .m-dot.night { background:#EDE9FE; }
.m-info { flex:1; min-width:0; }
.m-name { font-size:12px; font-weight:700; margin-bottom:5px; display:flex; align-items:baseline; gap:6px; }
.m-name .m-t { font-size:9px; color:var(--ink3); font-weight:400; }
.m-name .m-s { font-size:9px; color:var(--accent); font-weight:700; margin-left:auto; }
.f-line { display:flex; align-items:center; justify-content:space-between; font-size:11px; color:var(--ink2); padding:4px 0; border-bottom:1px dashed rgba(232,223,208,0.6); }
.f-line:last-child { border-bottom:none; }
.f-p { font-size:9px; color:var(--ink3); margin-left:4px; }
.f-k { font-size:10px; font-weight:700; color:var(--butter); }
.adv { background:var(--sage-l); border-radius:14px; padding:13px; border:1px solid rgba(122,155,118,0.15); }
.a-good { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px; }
.g-tag { font-size:9px; font-weight:700; background:#fff; color:var(--sage); border-radius:8px; padding:4px 9px; border:1px solid rgba(122,155,118,0.25); }
.a-tip { display:flex; gap:7px; padding:3px 0; }
.at-d { width:4px; height:4px; border-radius:50%; background:var(--sage); margin-top:5.5px; flex-shrink:0; }
.at-t { font-size:10.5px; color:var(--ink2); line-height:1.6; }
.a-final { margin-top:10px; font-size:10.5px; font-weight:600; color:var(--sage); background:rgba(255,255,255,0.6); border-radius:10px; padding:8px 12px; border:1px dashed rgba(122,155,118,0.3); }
/* Quick add section */
.quick-sec { margin-top:12px; }
.qa-box { background:var(--butter-l); border:1.5px dashed var(--butter); border-radius:14px; padding:14px; text-align:center; }
.qa-title { font-size:12px; font-weight:700; color:var(--ink); margin-bottom:4px; }
.qa-sub { font-size:10px; color:var(--ink2); margin-bottom:10px; line-height:1.5; }
.qa-btns { display:flex; gap:8px; justify-content:center; }
.qa-btn { flex:1; padding:9px; border-radius:10px; border:none; font-size:12px; font-weight:700; cursor:pointer; transition:transform .15s; font-family:inherit; }
.qa-btn:active { transform:scale(0.96); }
.qa-btn.primary { background:var(--accent); color:#fff; box-shadow:0 3px 10px rgba(232,115,74,0.3); }
.qa-btn.secondary { background:#fff; color:var(--ink2); border:1.5px solid var(--line); }
/* Bottom nav */
.bnav { flex-shrink:0; display:flex; justify-content:space-between; align-items:center; padding:10px 24px 14px; }
.bn-btn { width:40px; height:40px; border-radius:13px; background:var(--card); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:17px; color:var(--ink2); cursor:pointer; box-shadow:0 2px 8px rgba(62,58,51,0.06); transition:transform .15s; }
.bn-btn:active { transform:scale(0.9); }
.bn-btn:disabled { opacity:0.25; }
.bn-mid { text-align:center; }
.bn-dots { display:flex; gap:5px; justify-content:center; margin-bottom:4px; }
.bn-dot { width:5px; height:5px; border-radius:3px; background:var(--line); transition:all .3s; }
.bn-dot.on { width:18px; background:var(--accent); }
.bn-num { font-size:10px; color:var(--ink3); font-weight:600; }
.bn-date { font-size:9px; color:var(--ink3); margin-top:1px; }
/* Modal */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:200; display:none; align-items:flex-end; justify-content:center; backdrop-filter:blur(3px); }
.modal-overlay.show { display:flex; }
.modal { background:var(--card); border-radius:22px 22px 0 0; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; padding:20px 20px 32px; animation:slideUp .3s cubic-bezier(.32,.72,.32,1); }
@keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
.modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.modal-title { font-size:17px; font-weight:800; }
.modal-close { width:30px; height:30px; border-radius:50%; background:var(--paper); border:none; font-size:14px; color:var(--ink2); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.modal-sec { margin-bottom:14px; }
.modal-label { font-size:11px; font-weight:700; color:var(--ink2); margin-bottom:6px; display:block; }
.modal-input { width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; font-size:14px; font-family:inherit; background:var(--paper); color:var(--ink); outline:none; transition:border .2s; }
.modal-input:focus { border-color:var(--accent); }
.modal-input::placeholder { color:var(--ink3); }
textarea.modal-input { min-height:80px; resize:vertical; }
.meal-picker { display:flex; gap:8px; flex-wrap:wrap; }
.meal-pick { padding:7px 14px; border-radius:10px; border:1.5px solid var(--line); background:#fff; font-size:12px; font-weight:600; color:var(--ink2); cursor:pointer; transition:all .2s; font-family:inherit; }
.meal-pick.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.photo-upload { border:2px dashed var(--line); border-radius:14px; padding:20px; text-align:center; cursor:pointer; transition:all .2s; }
.photo-upload:active { border-color:var(--accent); background:rgba(232,115,74,0.04); }
.photo-upload .pu-icon { font-size:28px; margin-bottom:6px; }
.photo-upload .pu-text { font-size:12px; color:var(--ink2); font-weight:600; }
.photo-upload .pu-sub { font-size:10px; color:var(--ink3); margin-top:3px; }
.photo-preview { max-width:100%; border-radius:12px; margin-top:8px; display:none; }
.photo-preview.show { display:block; }
.analyze-btn { width:100%; padding:14px; border-radius:14px; border:none; background:var(--accent); color:#fff; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit; box-shadow:0 4px 14px rgba(232,115,74,0.3); transition:all .2s; }
.analyze-btn:active { transform:scale(0.98); }
.analyze-btn:disabled { opacity:0.5; }
.analyze-result { margin-top:14px; padding:14px; background:var(--sage-l); border-radius:14px; display:none; border:1px solid rgba(122,155,118,0.2); }
.analyze-result.show { display:block; }
.ar-title { font-size:12px; font-weight:800; color:var(--sage); margin-bottom:8px; }
.ar-item { display:flex; justify-content:space-between; font-size:12px; padding:5px 0; border-bottom:1px dashed rgba(122,155,118,0.2); }
.ar-item .k { color:var(--ink2); } .ar-item .v { font-weight:700; color:var(--accent); }
.ar-summary { font-size:11px; color:var(--ink2); margin-top:8px; line-height:1.6; }
.ar-actions { display:flex; gap:8px; margin-top:12px; }
.ar-actions button { flex:1; padding:10px; border-radius:10px; border:none; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
.ar-save { background:var(--sage); color:#fff; }
.ar-copy { background:#fff; color:var(--ink2); border:1.5px solid var(--line); }
.loading { text-align:center; padding:20px; display:none; }
.loading .ld-icon { font-size:28px; animation:spin 1s linear infinite; display:inline-block; }
@keyframes spin { to { transform:rotate(360deg); } }
.loading .ld-text { font-size:11px; color:var(--ink3); margin-top:8px; }
/* FAB */
.fab { position:fixed; right:16px; bottom:70px; width:52px; height:52px; border-radius:17px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer; box-shadow:0 6px 20px rgba(232,115,74,0.4); border:none; z-index:50; transition:transform .2s; }
.fab:active { transform:scale(0.9) rotate(90deg); }
/* Toast */
.toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(16px); background:var(--ink); color:var(--paper); font-size:12px; padding:8px 18px; border-radius:20px; opacity:0; pointer-events:none; transition:all .3s cubic-bezier(.32,.72,.32,1); z-index:300; white-space:nowrap; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>

<div class="head">
  <div class="h-brand">
    <div class="h-logo">📖</div>
    <div><div class="h-title">健康手账</div><div class="h-sub">体重 · 饮食 · 每日记录</div></div>
  </div>

</div>
<div class="stats" id="stats"></div>
<div class="carousel" id="carousel"><div class="track" id="track"></div></div>
<div class="bnav">
  <button class="bn-btn" id="btnPrev" onclick="go(-1)">‹</button>
  <div class="bn-mid"><div class="bn-dots" id="dots"></div><div class="bn-num" id="pageNum"></div><div class="bn-date" id="pageDate"></div></div>
  <button class="bn-btn" id="btnNext" onclick="go(1)">›</button>
</div>
<button class="fab" onclick="openModal()">+</button>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">📝 记录一下</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-sec">
      <label class="modal-label">餐次</label>
      <div class="meal-picker" id="mealPicker">
        <button class="meal-pick active" data-meal="早餐">🌅 早餐</button>
        <button class="meal-pick" data-meal="午餐">☀️ 午餐</button>
        <button class="meal-pick" data-meal="晚餐">🌙 晚餐</button>
        <button class="meal-pick" data-meal="加餐">🍰 加餐</button>
      </div>
    </div>
    <div class="modal-sec">
      <label class="modal-label">吃了什么？（用逗号或换行分隔）</label>
      <textarea class="modal-input" id="foodInput" placeholder="例如：&#10;米饭半碗，西兰花炒虾仁&#10;一个苹果，一杯牛奶"></textarea>
    </div>
    <div class="modal-sec">
      <label class="modal-label">📸 拍照识别（可选）</label>
      <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
        <div class="pu-icon">📷</div>
        <div class="pu-text">点击拍照或选图</div>
        <div class="pu-sub">AI 帮你识别食物和估算热量</div>
      </div>
      <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="previewPhoto(this)">
      <img class="photo-preview" id="photoPreview">
    </div>
    <div class="modal-sec" id="apiKeySec" style="display:none;">
      <label class="modal-label">🔑 OpenAI API Key（用于AI识图，仅存在你的手机上）</label>
      <input type="password" class="modal-input" id="apiKeyInput" placeholder="sk-..." style="font-size:12px;">
      <div style="font-size:9px; color:var(--ink3); margin-top:5px; line-height:1.5;">
        免费获取：platform.openai.com/api-keys<br>
        不填也可以用，文字输入照样能用本地食物库分析
      </div>
    </div>
    <button class="analyze-btn" id="analyzeBtn" onclick="analyze()">🔍 AI 分析热量</button>
    <div class="loading" id="loading"><div class="ld-icon">🔄</div><div class="ld-text">正在分析，请稍等...</div></div>
    <div class="analyze-result" id="result">
      <div class="ar-title">📊 分析结果</div>
      <div id="resultItems"></div>
      <div class="ar-summary" id="resultSummary"></div>
      <div class="ar-actions">
        <button class="ar-copy" onclick="copyResult()">📋 复制发给AI</button>
        <button class="ar-save" onclick="saveToLocal()">💾 保存到今天</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

function update() {
  track.style.transform = `translateX(-${cur*100}%)`;
  document.querySelectorAll(".bn-dot").forEach((d,i) => d.classList.toggle("on",i===cur));
  document.getElementById("btnPrev").disabled = cur === 0;
  document.getElementById("btnNext").disabled = cur === slides.length - 1;
  document.getElementById("pageNum").textContent = `${cur+1} / ${slides.length}`;
  document.getElementById("pageDate").textContent = D.days[cur].date;
}
function go(dir) { const n = cur + dir; if(n<0||n>=slides.length) return; cur=n; update(); }
const car = document.getElementById("carousel");
let sx=0, sy=0;
car.addEventListener("touchstart", e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
car.addEventListener("touchend", e=>{const dx=e.changedTouches[0].clientX-sx;const dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4)go(dx<0?1:-1);},{passive:true});
document.addEventListener("keydown", e=>{if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1);});

function openModal() {

function previewPhoto(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById("photoPreview");
    img.src = e.target.result;
    img.classList.add("show");
    photoBase64 = e.target.result;
  };
  reader.readAsDataURL(file);
}

// Text-based food analysis using local DB
function analyzeText(text) {
  const lines = text.split(/[，,、\n]/).map(s => s.trim()).filter(Boolean);
  const items = [];
  let totalKcal = 0;
  lines.forEach(line => {
    let matched = false;
    for (const [key, val] of Object.entries(FOOD_DB)) {
      if (line.includes(key)) {
        let portion = val.default;
        // Try to detect quantity
        const qtyMatch = line.match(/(\d+(?:\.\d+)?)\s*(个|碗|杯|片|根|块|份|把|包)/);
        const halfMatch = line.match(/半\s*(个|碗|杯|片|根|块|份)/);
        if (qtyMatch) portion = Math.round(val.default * parseFloat(qtyMatch[1]));
        else if (halfMatch) portion = Math.round(val.default * 0.5);
        items.push({ name: key, detail: line, kcal: portion });
        totalKcal += portion;
        matched = true;
        break;
      }
    }
    if (!matched) {
      // Unmatched food, rough estimate
      const est = 80;
      items.push({ name: line, detail: "估算", kcal: est });
      totalKcal += est;
    }
  });
  return { items, totalKcal };
}

async function analyze() {
  const text = document.getElementById("foodInput").value.trim();
  const btn = document.getElementById("analyzeBtn");
  const loading = document.getElementById("loading");
  const result = document.getElementById("result");
  if (!text && !photoBase64) { showToast("请输入食物或拍照 📷"); return; }
  const keyVal = document.getElementById("apiKeyInput")?.value.trim();
  if (keyVal) localStorage.setItem("openai_api_key", keyVal);
  btn.disabled = true;
  loading.style.display = "block";
  result.classList.remove("show");
  await new Promise(r => setTimeout(r, 800));

  const apiKey = localStorage.getItem("openai_api_key") || "";
  if (apiKeySec) apiKeySec.style.display = (photoBase64 && !apiKey) ? "block" : "none";

  let analysis;
  if (photoBase64 && apiKey) {
    // Real AI analysis with photo
    try {
      const resp = await fetch("https://api.openai.com/v1/chat/completions", {
        method:"POST",
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + apiKey },
        body: JSON.stringify({
          model:"gpt-4o-mini",
          messages:[{role:"user",content:[
            {type:"text",text:"识别图片中的所有食物。用中文回复，格式：食物名+估算分量+热量(kcal)，每行一个，例如：\n米饭(半碗) 100kcal\n西兰花炒虾仁(1份) 150kcal\n只列食物，不要其他说明。"},
            {type:"image_url",image_url:{url:photoBase64}}
          ]}]
        }),
        max_tokens: 500
      });
      const data = await resp.json();
      const aiText = data.choices?.[0]?.message?.content || "";
      if (aiText) {
        analysis = analyzeText(aiText);
        analysis.aiUsed = true;
      } else {
        analysis = analyzeText(text || "食物");
      }
    } catch (err) {
      console.error("AI call failed:", err);
      analysis = analyzeText(text || "未知食物");
      analysis.aiError = true;
    }
  } else {
    analysis = analyzeText(text || "食物");
  }

  loading.style.display = "none";
  btn.disabled = false;
  lastResult = analysis;
  document.getElementById("resultItems").innerHTML = analysis.items.map(it => `<div class="ar-item"><span class="k">${it.name}${it.detail !== it.name ? ` (${it.detail})` : ""}</span><span class="v">${it.kcal} kcal</span></div>`).join("");
  let aiNote = "";
  if (analysis.aiUsed) aiNote = "🤖 AI识图结果";
  else if (analysis.aiError) aiNote = "⚠️ AI调用失败，使用本地估算";
  else if (photoBase64) aiNote = "📝 基于本地食物库估算";
  document.getElementById("resultSummary").innerHTML = `${aiNote ? aiNote + "<br>" : ""}<b>总热量约 ${analysis.totalKcal} kcal</b><br>${getSummary(analysis.totalKcal)}`;
  result.classList.add("show");
}

function getSummary(kcal) {
  if (kcal < 100) return "热量很低，适合加餐或轻食";
  if (kcal < 300) return "热量适中，一顿不错的餐食";
  if (kcal < 600) return "热量偏高，注意主食和油脂的量";
  return "热量较高，建议减少主食或增加运动";
}

function copyResult() {
  if (!lastResult) return;
  const text = `我吃了：${lastResult.items.map(i => `${i.name}(${i.detail})`).join("、")}\n估算总热量约 ${lastResult.totalKcal} kcal`;
  navigator.clipboard.writeText(text).then(() => showToast("已复制，去粘贴给AI吧 📋"));
}

function saveToLocal() {
  if (!lastResult) return;
  const entries = loadUserEntries();
  if (!entries[today]) entries[today] = [];
  entries[today].push({
    meal: selectedMeal,
    time: new Date().getHours() < 12 ? "早上" : (new Date().getHours() < 18 ? "下午" : "晚上"),
    items: lastResult.items.map(i => ({ name: i.name, portion: i.detail, kcal: i.kcal }))
  });
  saveUserEntries(entries);
  closeModal();
  showToast("已保存到今天的手账 ✅");
  setTimeout(() => location.reload(), 1000);
}

function tellMe() {
  const text = `请帮我记录今天(${today})的饮食：`;
  navigator.clipboard.writeText(text).then(() => showToast("已复制，去粘贴给AI吧 💬"));
}

update();
