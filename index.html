<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CalTrack · 热量管家</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
--bg:#F8F9FB;--bg2:#FFFFFF;--card:#FFFFFF;--card2:#F5F6F8;
--border:#E8EAF0;
--text:#1A1D28;--text2:#5A6478;--text3:#9AA3B5;
--primary:#7C5CFC;--primary2:#7C5CFC;
--green:#00B884;--green-bg:rgba(0,184,132,0.08);
--orange:#FF8C42;--orange-bg:rgba(255,140,66,0.08);
--blue:#4A9EFF;--blue-bg:rgba(74,158,255,0.08);
--pink:#FF5C8A;--pink-bg:rgba(255,92,138,0.08);
--red:#FF5C5C;
--yellow:#FFB800;
--r:16px;--r-sm:12px;
--sh:0 1px 3px rgba(26,29,40,0.04),0 4px 16px rgba(26,29,40,0.06);
--safe-t:env(safe-area-inset-top,0px);
--safe-b:env(safe-area-inset-bottom,0px);
}
html,body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;}
body{background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;max-width:430px;margin:0 auto;}
::-webkit-scrollbar{display:none;}

/* ===== Header ===== */
.header{flex-shrink:0;padding:calc(var(--safe-t) + 12px) 20px 12px;display:flex;justify-content:space-between;align-items:center;}
.h-left{display:flex;align-items:center;gap:10px;}
.h-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--pink));display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;}
.h-greeting{font-size:15px;font-weight:700;color:var(--text);}
.h-date{font-size:11px;color:var(--text3);margin-top:1px;}
.h-btn{width:36px;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--border);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;}
.h-btn:active{transform:scale(0.9);background:var(--card2);}
.h-btn svg{width:18px;height:18px;color:var(--text2);}

/* ===== Content ===== */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px calc(var(--safe-b) + 90px);scrollbar-width:none;}
.content::-webkit-scrollbar{display:none;}

/* ===== Calorie Hero ===== */
.hero-card{background:linear-gradient(145deg,#FFFFFF,#F8F7FF);border:1px solid var(--border);border-radius:24px;padding:24px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:var(--sh);}
.hero-card::before{content:"";position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,0.15),transparent 70%);}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;position:relative;z-index:1;}
.hero-label{font-size:12px;color:var(--text3);font-weight:600;letter-spacing:0.5px;}
.hero-date{font-size:11px;color:var(--text2);background:var(--bg2);padding:4px 10px;border-radius:12px;border:1px solid var(--border);font-variant-numeric:tabular-nums;}
.date-nav{width:26px;height:26px;border-radius:9px;background:var(--bg2);border:1px solid var(--border);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;padding:0;}
.date-nav svg{width:12px;height:12px;}
.date-nav:active{transform:scale(0.85);background:var(--card2);}
.date-nav:disabled{opacity:0.2;pointer-events:none;}
.hero-main{display:flex;align-items:center;gap:24px;position:relative;z-index:1;}
.ring-wrap{position:relative;width:130px;height:130px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--line);stroke-width:10;}
.ring-val{fill:none;stroke:url(#grad);stroke-width:10;stroke-linecap:round;stroke-dasharray:377;stroke-dashoffset:377;transition:stroke-dashoffset 1.2s cubic-bezier(.32,.72,.28,1);}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-num{font-size:30px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;}
.ring-unit{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:1px;margin-top:2px;}
.hero-info{flex:1;}
.hero-info .hi-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;}
.hero-info .hi-row + .hi-row{border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(26,29,40,0.04);}
.hi-label{font-size:12px;color:var(--text2);font-weight:500;}
.hi-val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
.hi-val.c1{color:var(--primary2);} .hi-val.c2{color:var(--orange);} .hi-val.c3{color:var(--pink);}

/* Macros */
.macros{display:flex;gap:10px;margin-bottom:14px;}
.macro-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 12px;text-align:center;transition:transform .2s;box-shadow:var(--sh);}
.macro-card:active{transform:scale(0.96);}
.mc-icon{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:15px;}
.mc-icon.p{background:var(--blue-bg);} .mc-icon.c{background:var(--orange-bg);} .mc-icon.f{background:var(--pink-bg);}
.mc-val{font-size:17px;font-weight:800;letter-spacing:-0.3px;font-variant-numeric:tabular-nums;}
.mc-val.p{color:var(--blue);} .mc-val.c{color:var(--orange);} .mc-val.f{color:var(--pink);}
.mc-label{font-size:10px;color:var(--text3);margin-top:3px;font-weight:600;}

/* Section */
.section{margin-bottom:18px;}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 2px;}
.sec-title{font-size:16px;font-weight:800;letter-spacing:-0.2px;display:flex;align-items:center;gap:7px;}
.sec-more{font-size:12px;color:var(--primary2);font-weight:600;cursor:pointer;}
.sec-more:active{opacity:0.6;}

/* Weight card */
.weight-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);}
.wc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.wc-title{font-size:14px;font-weight:700;color:var(--text2);}
.wc-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:10px;}
.wc-badge.up{color:var(--orange);background:var(--orange-bg);}
.wc-badge.down{color:var(--green);background:var(--green-bg);}
.wc-big{display:flex;align-items:baseline;gap:4px;margin-bottom:6px;}
.wc-num{font-size:42px;font-weight:800;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;color:var(--text);}
.wc-unit{font-size:15px;color:var(--text3);font-weight:600;}
.wc-sub{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;}
.wc-sub .dot{width:5px;height:5px;border-radius:50%;background:var(--green);}
/* Mini chart */
.mini-chart{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(26,29,40,0.04);}
.mini-chart .mc-label{margin-bottom:8px;}
.chart-svg{width:100%;height:60px;display:block;}

/* Meals */
.meal-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden;transition:transform .2s;box-shadow:var(--sh);}
.meal-card:active{transform:scale(0.98);}
.meal-row{display:flex;align-items:center;padding:14px 16px;gap:14px;}
.meal-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.meal-icon.breakfast{background:rgba(234,179,8,0.15);}
.meal-icon.lunch{background:var(--blue-bg);}
.meal-icon.dinner{background:rgba(139,92,246,0.15);}
.meal-icon.snack{background:var(--pink-bg);}
.meal-info{flex:1;min-width:0;}
.meal-name{font-size:14px;font-weight:700;margin-bottom:2px;}
.meal-detail{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.meal-right{text-align:right;flex-shrink:0;}
.meal-kcal{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;}
.meal-kcal .u{font-size:10px;color:var(--text3);font-weight:500;}
.meal-time{font-size:10px;color:var(--text3);margin-top:2px;}
.add-meal-btn{width:100%;padding:14px;border-radius:var(--r);border:1.5px dashed var(--border);background:transparent;color:var(--text3);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;}
.add-meal-btn:active{border-color:var(--primary);color:var(--primary2);background:rgba(139,92,246,0.05);transform:scale(0.98);}
.add-meal-btn svg{width:16px;height:16px;}

/* Advice card */
.advice-card{background:linear-gradient(135deg,rgba(16,185,129,0.08),rgba(16,185,129,0.03));border:1px solid rgba(16,185,129,0.15);border-radius:20px;padding:18px;margin-bottom:14px;}
.adv-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.adv-head .ah-icon{width:32px;height:32px;border-radius:10px;background:var(--green-bg);display:flex;align-items:center;justify-content:center;font-size:14px;}
.adv-head .ah-title{font-size:14px;font-weight:800;color:var(--green);}
.adv-good{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.g-tag{font-size:11px;font-weight:600;color:var(--green);background:rgba(16,185,129,0.1);border-radius:16px;padding:5px 12px;border:1px solid rgba(16,185,129,0.2);}
.adv-tip{display:flex;gap:8px;padding:5px 0;font-size:12px;color:var(--text2);line-height:1.6;}
.adv-tip .at-d{width:4px;height:4px;border-radius:50%;background:var(--green);margin-top:7px;flex-shrink:0;opacity:0.6;}
.adv-final{margin-top:12px;font-size:12px;font-weight:600;color:var(--text);background:rgba(0,184,132,0.06);border-radius:12px;padding:10px 14px;line-height:1.6;border:1px solid var(--border);}

/* Bottom Tab Bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(26,29,40,0.04);display:flex;justify-content:space-around;padding:8px 0 calc(var(--safe-b) + 8px);z-index:100;}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 16px;cursor:pointer;color:var(--text3);transition:all .2s;border:none;background:none;font-family:inherit;position:relative;}
.tab-item svg{width:22px;height:22px;}
.tab-item span{font-size:9px;font-weight:600;letter-spacing:0.3px;}
.tab-item.active{color:var(--primary2);}
.tab-item:active{transform:scale(0.9);}
.tab-item .ti-dot{position:absolute;top:-2px;width:4px;height:4px;border-radius:50%;background:var(--primary);opacity:0;transition:opacity .2s;}
.tab-item.active .ti-dot{opacity:1;}

/* FAB */
.fab{position:fixed;right:calc(50% - 215px + 20px);bottom:calc(var(--safe-b) + 74px);width:56px;height:56px;border-radius:20px;background:linear-gradient(135deg,var(--primary),var(--pink));color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;box-shadow:0 8px 24px rgba(139,92,246,0.4);z-index:99;transition:all .25s cubic-bezier(.32,.72,.28,1);}
@media(max-width:430px){.fab{right:20px;}}
.fab:active{transform:scale(0.85) rotate(90deg);}
.fab svg{width:24px;height:24px;}

/* Modal */
.mo{position:fixed;inset:0;background:rgba(26,29,40,0.35);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s ease;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.mo.show{opacity:1;pointer-events:auto;}
.modal{background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-width:430px;max-height:92vh;overflow-y:auto;padding:8px 20px calc(var(--safe-b) + 24px);transform:translateY(100%);transition:transform .4s cubic-bezier(.32,.72,.28,1);scrollbar-width:none;border:1px solid var(--border);border-bottom:none;}
.modal::-webkit-scrollbar{display:none;}
.mo.show .modal{transform:translateY(0);}
.modal::before{content:"";position:sticky;top:8px;display:block;width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 16px;}
.m-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.m-title{font-size:20px;font-weight:800;letter-spacing:-0.3px;}
.m-close{width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;}
.m-close:active{transform:scale(0.9);background:var(--card2);}
.m-close svg{width:14px;height:14px;}
.m-sec{margin-bottom:20px;}
.m-label{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.m-label .ml-ico{font-size:14px;}
.meal-picker{display:flex;gap:8px;}
.mp{flex:1;padding:12px 4px;border-radius:14px;border:1.5px solid var(--border);background:var(--card);font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .2s;font-family:inherit;text-align:center;}
.mp:active{transform:scale(0.95);}
.mp.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 4px 12px rgba(139,92,246,0.3);}
.m-input{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:var(--r);font-size:15px;font-family:inherit;background:var(--card);color:var(--text);outline:none;transition:border .2s;line-height:1.6;resize:vertical;}
.m-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(139,92,246,0.1);}
.m-input::placeholder{color:var(--text3);}
.m-btn{width:100%;padding:16px;border-radius:var(--r);border:none;background:linear-gradient(135deg,var(--primary),var(--pink));color:#fff;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 6px 20px rgba(139,92,246,0.35);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.m-btn:active{transform:scale(0.97);}
.m-btn:disabled{opacity:0.5;pointer-events:none;}
.m-btn svg{width:18px;height:18px;}
.loading{text-align:center;padding:30px;display:none;}
.loading.show{display:block;}
.ld-icon{font-size:36px;animation:spin 1s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.ld-text{font-size:13px;color:var(--text3);margin-top:12px;font-weight:500;}
.result{margin-top:16px;padding:18px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);display:none;animation:popIn .4s cubic-bezier(.32,.72,.28,1);}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(0.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.result.show{display:block;}
.ar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.ar-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px;}
.ar-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:12px;background:var(--green-bg);color:var(--green);}
.ar-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.ar-item .k{font-size:14px;color:var(--text);font-weight:600;}
.ar-item .kd{font-size:11px;color:var(--text3);display:block;margin-top:2px;font-weight:400;}
.ar-item .v{font-weight:700;color:var(--orange);font-variant-numeric:tabular-nums;font-size:15px;}
.ar-total{display:flex;justify-content:space-between;align-items:center;padding:14px 0 4px;font-size:15px;font-weight:800;}
.ar-total .v{color:var(--orange);font-size:20px;font-variant-numeric:tabular-nums;}
.ar-sum{font-size:12px;color:var(--text2);margin-top:12px;line-height:1.7;padding:12px;background:var(--bg);border-radius:var(--r-sm);border:1px solid var(--border);}
.ar-actions{display:flex;gap:10px;margin-top:16px;}
.ar-actions button{flex:1;padding:14px;border-radius:var(--r);border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;}
.ar-actions button:active{transform:scale(0.96);}
.ar-save{background:linear-gradient(135deg,var(--primary),var(--pink));color:#fff;box-shadow:0 4px 12px rgba(139,92,246,0.3);}
.ar-copy{background:var(--card);color:var(--text2);border:1.5px solid var(--border);}

/* Toast */
.toast{position:fixed;bottom:calc(var(--safe-b) + 90px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;font-size:13px;font-weight:600;padding:12px 22px;border-radius:28px;opacity:0;pointer-events:none;transition:all .4s cubic-bezier(.32,.72,.28,1);z-index:300;white-space:nowrap;border:1px solid var(--border);box-shadow:0 8px 24px rgba(26,29,40,0.15);max-width:85vw;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Entry animation */
.fade-up{animation:fadeUp .5s cubic-bezier(.32,.72,.28,1) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<div class="header">
<div class="h-left">
<div class="h-avatar">💪</div>
<div><div class="h-greeting" id="greeting">Hi, 今天也要加油</div><div class="h-date" id="todayDate"></div></div>
</div>
<button class="h-btn" onclick="showToast('设置功能开发中')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</div>

<div class="content" id="content">

<!-- Calorie Ring -->
<div class="hero-card fade-up">
<div class="hero-top"><div class="hero-label" id="heroLabel">今日热量</div><div style="display:flex;align-items:center;gap:6px;"><button class="date-nav" onclick="navDay(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg></button><div class="hero-date" id="heroDate"></div><button class="date-nav" onclick="navDay(1)" id="btnNextDay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></button></div></div>
<div class="hero-main">
<div class="ring-wrap">
<svg width="130" height="130" viewBox="0 0 130 130">
<defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient></defs>
<circle class="ring-bg" cx="65" cy="65" r="60"/>
<circle class="ring-val" id="ringVal" cx="65" cy="65" r="60"/>
</svg>
<div class="ring-center"><div class="ring-num" id="ringNum">0</div><div class="ring-unit">/ 2000 KCAL</div></div>
</div>
<div class="hero-info">
<div class="hi-row"><span class="hi-label">已摄入</span><span class="hi-val c1" id="hiEaten">0 kcal</span></div>
<div class="hi-row"><span class="hi-label">还能吃</span><span class="hi-val c2" id="hiLeft">2000 kcal</span></div>
<div class="hi-row"><span class="hi-label">蛋白质</span><span class="hi-val c3" id="hiProtein">0g</span></div>
</div>
</div>
</div>

<!-- Macros -->
<div class="macros fade-up" style="animation-delay:.1s;">

const DATA_DAYS=[
{
date:"2026-09-29",weekday:"周二",
weight:{morning:72.0,evening:null,baseline:70.0,target:70.0,note:"比昨天下降1.4kg，水分回落中"},
meals:[

],

},
{

{type:"午餐",time:"中午",kcal:530,items:[{name:"蒜苗芦笋炒肉",portion:"~100g",kcal:80},{name:"芹菜黄瓜凉拌",portion:"~80g",kcal:25},{name:"小白菜香菇",portion:"~100g",kcal:60},{name:"青椒香菇肉片",portion:"~80g",kcal:110},{name:"豌豆虾仁蛋",portion:"~80g",kcal:100},{name:"凉拌豆芽",portion:"~80g",kcal:20},{name:"蒸玉米",portion:"~1/2根",kcal:60},{name:"米饭",portion:"半拳头",kcal:75}]},

];
const TODAY="2026-09-29";
let dayIdx=0; // 0 = today, 1 = yesterday, etc.

// Init
const now=new Date();
const hour=now.getHours();
document.getElementById("greeting").textContent=hour<12?"早上好 ☀️":hour<18?"下午好 🌤":"晚上好 🌙";
const mealIcons={"早餐":{icon:"🌅",cls:"breakfast"},"午餐":{icon:"☀️",cls:"lunch"},"晚餐":{icon:"🌙",cls:"dinner"},"加餐":{icon:"🍰",cls:"snack"}};

function navDay(dir){
const n=dayIdx+dir;
if(n<0||n>=DATA_DAYS.length){showToast(n<0?"已经是第一天":"已经是今天");return;}
dayIdx=n;
renderDay();
}

function renderDay(){
const D=DATA_DAYS[dayIdx];
const isToday=D.date===TODAY;
// Header
document.getElementById("todayDate").textContent=`${D.date} ${D.weekday}`;
document.getElementById("heroDate").textContent=`${D.date.slice(5)} ${D.weekday}`;
document.getElementById("heroLabel").textContent=isToday?"今日热量":`${D.date.slice(5)} 热量`;
document.getElementById("btnNextDay").disabled=isToday;

// Ring
const total=safeNum(D.summary.totalKcal,0),goal=2000;
const pct=Math.min(total/goal,1);
const offset=377*(1-pct);
document.getElementById("ringVal").style.strokeDashoffset=offset;
document.getElementById("ringNum").textContent=total;
document.getElementById("hiEaten").textContent=total+" kcal";
document.getElementById("hiLeft").textContent=Math.max(goal-total,0)+" kcal";
document.getElementById("hiProtein").textContent=safeNum(D.summary.protein,0)+"g";
document.getElementById("macroP").textContent=safeNum(D.summary.protein,0)+"g";
document.getElementById("macroC").textContent=safeNum(D.summary.carbs,0)+"g";
document.getElementById("macroF").textContent=safeNum(D.summary.fat,0)+"g";

// Weight
const w=D.weight;
document.getElementById("wcNum").textContent=safeNum(w.morning,0).toFixed(1);
const chg=safeNum(w.morning,0)-safeNum(w.baseline,0);
const badge=document.getElementById("wcBadge");
if(chg>0){badge.textContent=`▲ 较基线 +${chg.toFixed(1)}`;badge.className="wc-badge up";}
else{badge.textContent=`▼ 较基线 ${chg.toFixed(1)}`;badge.className="wc-badge down";}
const diff=safeNum(w.morning,0)-safeNum(w.target,0);
document.getElementById("wcSub").textContent=diff>0?`第一阶段目标 ${w.target}kg · 还差 ${diff.toFixed(1)}kg`:`🎉 已达成第一阶段目标！`;

// Chart (always shows all days for context)
const weights=DATA_DAYS.map(d=>safeNum(d.weight.morning,0)).reverse();
const dates=DATA_DAYS.map(d=>d.date.slice(5)).reverse();
if(weights.length>=2){
const wMin=Math.min(...weights)-0.5,wMax=Math.max(...weights)+0.5,wRange=wMax-wMin||1;
const CW=320,CH=50,CP=6;
const pts=weights.map((v,i)=>{
const x=CP+(i/(weights.length-1))*(CW-2*CP);
const y=CP+(1-(v-wMin)/wRange)*(CH-2*CP);
return[x,y];
});
const line=pts.map(p=>p.join(",")).join(" ");
const area=`${CP},${CH-CP} ${line} ${CW-CP},${CH-CP}`;
const activeIdx=weights.length-1-dayIdx;
document.getElementById("chartArea").innerHTML=`
<svg class="chart-svg" viewBox="0 0 ${CW} ${CH}" preserveAspectRatio="none">
<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient></defs>
<polygon points="${area}" fill="url(#cg)"/>
<polyline points="${line}" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===activeIdx?5:3.5}" fill="${i===activeIdx?'#8B5CF6':'#475569'}" stroke="#FFFFFF" stroke-width="2"/>`).join("")}
</svg>
<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text3);margin-top:6px;">
${dates.map((d,i)=>`<span style="${i===activeIdx?'color:var(--primary2);font-weight:600;':''}">${d}</span>`).join("")}
</div>`;
}

// Meals
let mealsHtml="";
D.meals.forEach(meal=>{
const mi=mealIcons[meal.type]||{icon:"🍽️",cls:"snack"};
const detail=meal.items.map(i=>i.name).join("、");
mealsHtml+=`
<div class="meal-card"><div class="meal-row">
<div class="meal-icon ${mi.cls}">${mi.icon}</div>
<div class="meal-info"><div class="meal-name">${meal.type}</div><div class="meal-detail">${detail}</div></div>
<div class="meal-right"><div class="meal-kcal">${safeNum(meal.kcal,0)}<span class="u"> kcal</span></div><div class="meal-time">${meal.time||""}</div></div>
</div></div>`;
});
if(isToday){
mealsHtml+=`<button class="add-meal-btn" onclick="openModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>添加饮食记录</button>`;
}
document.getElementById("mealList").innerHTML=mealsHtml;

// Advice
const a=D.advice;
document.getElementById("advGood").innerHTML=a.good.map(g=>`<span class="g-tag">✓ ${g}</span>`).join("");
document.getElementById("advTips").innerHTML=a.tips.map(t=>`<div class="adv-tip"><div class="at-d"></div><div>${t}</div></div>`).join("");
document.getElementById("advFinal").innerHTML=`📌 ${a.overall}`;

// Reset scroll
document.getElementById("content").scrollTo({top:0,behavior:"smooth"});
}

// Also update saveLocal to use current date
const _origSave=saveLocal;

if(!lastRes)return;
const curDate=DATA_DAYS[dayIdx].date;
const entries=loadEntriesSafe();
if(!entries[curDate])entries[curDate]=[];
entries[curDate].push({type:selMeal,icon:mealIcons[selMeal]?.icon||"📝",cls:mealIcons[selMeal]?.cls||"snack",time:new Date().getHours()<12?"早上":(new Date().getHours()<18?"下午":"晚上"),kcal:lastRes.total,items:lastRes.items.map(i=>({name:i.name,portion:i.detail,kcal:i.kcal}))});

document.getElementById("mo").addEventListener("click",e=>{if(e.target===e.currentTarget)closeModal();});
function previewPhoto(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const pp=document.getElementById("pp");pp.src=e.target.result;pp.style.display="block";photoB64=e.target.result;};r.readAsDataURL(f);}

function analyzeText(text){
const lines=text.split(/[，,、;；\n]/).map(s=>s.trim()).filter(Boolean);
const items=[];let total=0;
lines.forEach(line=>{
let matched=false;
for(const[key,val]of Object.entries(FOOD_DB)){
if(line.includes(key)){
let p=val.def;
const q=line.match(/(\d+(?:\.\d+)?)\s*(个|碗|杯|片|根|块|份|把|包)/);
const h=line.match(/半\s*(个|碗|杯|片|根|块|份)/);
if(q)p=Math.round(val.def*parseFloat(q[1]));else if(h)p=Math.round(val.def*0.5);
items.push({name:key,detail:line,kcal:p});total+=p;matched=true;break;
}}
if(!matched){items.push({name:line,detail:"估算",kcal:80});total+=80;}
});
return{items,total};
}

async function analyze(){
const text=document.getElementById("fi").value.trim();
const btn=document.getElementById("ab");
if(!text&&!photoB64){showToast("请输入食物或拍照 📷");return;}
btn.disabled=true;document.getElementById("ld").classList.add("show");
document.getElementById("result").classList.remove("show");
await new Promise(r=>setTimeout(r,600));
let res;
if(photoB64){
try{
const resp=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(localStorage.getItem("openai_api_key")||"demo")},body:JSON.stringify({model:"gpt-4o-mini",messages:[{role:"user",content:[{type:"text",text:"识别图片中的所有食物，用中文回复，格式：食物名(分量) 热量kcal，每行一个。只列食物。"},{type:"image_url",image_url:{url:photoB64}}]}]}),max_tokens:500});
const data=await resp.json();
const aiText=data.choices?.[0]?.message?.content||"";
res=analyzeText(aiText||text||"食物");res.aiUsed=true;
}catch(e){res=analyzeText(text||"食物");res.aiError=true;}
}else{res=analyzeText(text);}
document.getElementById("ld").classList.remove("show");
btn.disabled=false;lastRes=res;
const badge=document.getElementById("arBadge");
if(res.aiUsed){badge.textContent="AI 识图";badge.style.display="";}
else if(res.aiError){badge.textContent="本地估算";badge.style.background="rgba(249,115,22,0.12)";badge.style.color="var(--orange)";badge.style.display="";}
else badge.style.display="none";
document.getElementById("ri").innerHTML=res.items.map(it=>`<div class="ar-item"><span class="k">${it.name}<span class="kd">${it.detail!==it.name?it.detail:""}</span></span><span class="v">${it.kcal} kcal</span></div>`).join("")+`<div class="ar-total"><span>总计</span><span class="v">${res.total} kcal</span></div>`;
document.getElementById("rs").innerHTML=`<div class="ar-sum">${getSummary(res.total)}</div>`;
document.getElementById("result").classList.add("show");
}
function getSummary(k){
if(k<100)return"热量很低，适合加餐或轻食";
if(k<300)return"热量适中，一顿不错的餐食";
if(k<600)return"热量偏高，注意主食和油脂的量";
return"热量较高，建议减少主食或增加运动";
}
function copyRes(){if(!lastRes)return;const t=`帮我记录今天(${DATA.date})的饮食：\n${lastRes.items.map(i=>`• ${i.name}（${i.detail}）≈ ${i.kcal} kcal`).join("\n")}\n总计约 ${lastRes.total} kcal`;
if(navigator.share){navigator.share({text:t}).catch(()=>{navigator.clipboard.writeText(t).then(()=>showToast("已复制 💬"));});}
else{navigator.clipboard.writeText(t).then(()=>showToast("已复制，去粘贴给AI 💬"));}}
function saveLocal(){if(!lastRes)return;
const entries=JSON.parse(localStorage.getItem("health_entries")||"{}");
if(!entries[DATA.date])entries[DATA.date]=[];
entries[DATA.date].push({type:selMeal,icon:mealIcons[selMeal]?.icon||"📝",cls:mealIcons[selMeal]?.cls||"snack",time:new Date().getHours()<12?"早上":(new Date().getHours()<18?"下午":"晚上"),kcal:lastRes.total,items:lastRes.items.map(i=>({name:i.name,portion:i.detail,kcal:i.kcal}))});
localStorage.setItem("health_entries",JSON.stringify(entries));
closeModal();showToast("已保存到今天 ✅");
setTimeout(()=>location.reload(),800);}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800);}
</script>
</body>
</html>
