<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kcal · 卡路里管家</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
--bg:#F2EEE9;--bg2:#FFFFFF;--card:#FFFFFF;
--ink:#2C2C2E;--ink2:#6B6B70;--ink3:#AEAEB2;
--line:#E8E4DE;
--peach:#FF9F7C;--peach-l:#FFF3EE;
--sage:#7FB69E;--sage-l:#EEF6F2;
--lilac:#B8A9E8;--lilac-l:#F3EFFC;
--lemon:#F2C94C;--lemon-l:#FEFAEC;
--coral:#FF8A80;
--r-lg:24px;--r-md:18px;--r-sm:12px;
--sh-sm:0 2px 8px rgba(44,44,46,0.04);
--sh-md:0 4px 20px rgba(44,44,46,0.07);
--sh-lg:0 8px 32px rgba(44,44,46,0.10);
--ease-spring:cubic-bezier(.34,1.56,.64,1);
--ease-out:cubic-bezier(.16,1,.3,1);
--ease-smooth:cubic-bezier(.32,.72,.28,1);
--safe-t:env(safe-area-inset-top,0px);
--safe-b:env(safe-area-inset-bottom,0px);
}
html{font-size:16px;}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","PingFang SC","Nunito","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--ink);height:100vh;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative;}
::-webkit-scrollbar{display:none;scrollbar-width:none;}

/* ===== Animated BG blobs ===== */
.bg-blobs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:0.4;}
.blob-1{width:280px;height:280px;background:var(--peach);top:-80px;right:-60px;animation:float1 12s ease-in-out infinite;}
.blob-2{width:220px;height:220px;background:var(--lilac);top:40%;left:-80px;animation:float2 14s ease-in-out infinite;}
.blob-3{width:200px;height:200px;background:var(--sage);bottom:-60px;right:10%;animation:float3 16s ease-in-out infinite;}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-20px,30px) scale(1.1);}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(30px,-20px) scale(0.9);}}
@keyframes float3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-30px,-20px) scale(1.05);}}

/* ===== Header ===== */
.header{flex-shrink:0;padding:calc(var(--safe-t) + 12px) 20px 10px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2;}
.h-left{display:flex;align-items:center;gap:11px;}
.h-logo{width:42px;height:42px;border-radius:16px;background:linear-gradient(135deg,var(--peach),var(--coral));display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 4px 14px rgba(255,159,124,0.35);transition:transform .3s var(--ease-spring);}
.h-logo:active{transform:scale(0.9) rotate(-10deg);}
.h-greeting{font-size:16px;font-weight:800;letter-spacing:-0.3px;}
.h-date{font-size:11px;color:var(--ink2);margin-top:1px;font-weight:500;}
.h-right{display:flex;gap:8px;}
.h-btn{width:38px;height:38px;border-radius:14px;background:var(--bg2);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--sh-sm);transition:all .25s var(--ease-spring);color:var(--ink2);}
.h-btn svg{width:17px;height:17px;}
.h-btn:active{transform:scale(0.85);box-shadow:var(--sh-md);}

/* ===== Scroll content ===== */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 20px calc(var(--safe-b) + 100px);scrollbar-width:none;position:relative;z-index:1;}
.content::-webkit-scrollbar{display:none;}

/* ===== Stagger animations ===== */
@keyframes popUp{from{opacity:0;transform:translateY(24px) scale(0.96);}to{opacity:1;transform:translateY(0) scale(1);}}
.pop{animation:popUp .55s var(--ease-out) both;}
@keyframes slideLeft{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}

/* ===== Calorie Hero ===== */
.hero{margin-bottom:16px;position:relative;}
.hero-card{background:var(--bg2);border-radius:var(--r-lg);padding:26px 22px;box-shadow:var(--sh-md);position:relative;overflow:hidden;}
.hero-card::before{content:"";position:absolute;top:-50px;right:-50px;width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,var(--peach-l),var(--lemon-l));opacity:0.7;}
.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;position:relative;z-index:1;}
.hero-label{font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;}
.hero-label .hl-dot{width:8px;height:8px;border-radius:50%;background:var(--peach);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.3);opacity:0.6;}}
.hero-nav{display:flex;align-items:center;gap:6px;}
.date-nav{width:30px;height:30px;border-radius:11px;background:var(--bg);border:none;color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s var(--ease-spring);box-shadow:var(--sh-sm);padding:0;}
.date-nav svg{width:13px;height:13px;}
.date-nav:active{transform:scale(0.8);background:var(--peach-l);color:var(--peach);}
.date-nav:disabled{opacity:0.25;pointer-events:none;}
.hero-date-chip{font-size:11px;font-weight:700;color:var(--ink2);background:var(--bg);padding:6px 12px;border-radius:16px;box-shadow:var(--sh-sm);font-variant-numeric:tabular-nums;min-width:70px;text-align:center;}
.hero-main{display:flex;align-items:center;gap:22px;position:relative;z-index:1;}
.ring-wrap{position:relative;width:140px;height:140px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--peach-l);stroke-width:11;}
.ring-val{fill:none;stroke:url(#rgrad);stroke-width:11;stroke-linecap:round;stroke-dasharray:389;stroke-dashoffset:389;transition:stroke-dashoffset 1.4s var(--ease-out);}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-num{font-size:34px;font-weight:800;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1;}
.ring-unit{font-size:9px;color:var(--ink3);font-weight:700;letter-spacing:1.5px;margin-top:5px;}
.hero-info{flex:1;display:flex;flex-direction:column;gap:0;}
.hi-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;}
.hi-row + .hi-row{border-top:1px dashed var(--line);}
.hi-label{font-size:12px;color:var(--ink2);font-weight:500;}
.hi-val{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;transition:color .3s;}
.hi-val.c1{color:var(--peach);} .hi-val.c2{color:var(--sage);} .hi-val.c3{color:var(--lilac);}

/* ===== Macros ===== */
.macros{display:flex;gap:12px;margin-bottom:18px;}
.macro-card{flex:1;background:var(--bg2);border-radius:var(--r-md);padding:16px 10px;text-align:center;box-shadow:var(--sh-sm);transition:all .3s var(--ease-spring);position:relative;overflow:hidden;}
.macro-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;border-radius:4px 4px 0 0;transition:width 1s var(--ease-out);width:0%;}
.macro-card.p::before{background:var(--sage);}
.macro-card.c::before{background:var(--peach);}
.macro-card.f::before{background:var(--lilac);}
.macro-card:active{transform:scale(0.94) translateY(2px);box-shadow:var(--sh-md);}
.mc-icon{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 9px;font-size:17px;transition:transform .3s var(--ease-spring);}
.macro-card:active .mc-icon{transform:scale(1.15) rotate(8deg);}
.mc-icon.p{background:var(--sage-l);} .mc-icon.c{background:var(--peach-l);} .mc-icon.f{background:var(--lilac-l);}
.mc-val{font-size:18px;font-weight:800;letter-spacing:-0.4px;font-variant-numeric:tabular-nums;}
.mc-val.p{color:var(--sage);} .mc-val.c{color:var(--peach);} .mc-val.f{color:var(--lilac);}
.mc-label{font-size:10px;color:var(--ink3);margin-top:3px;font-weight:600;}

/* ===== Weight ===== */
.weight-card{background:var(--bg2);border-radius:var(--r-lg);padding:22px;margin-bottom:18px;box-shadow:var(--sh-sm);position:relative;overflow:hidden;}
.weight-card::after{content:"⚖️";position:absolute;top:14px;right:16px;font-size:40px;opacity:0.06;transform:rotate(-10deg);}
.wc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.wc-title{font-size:14px;font-weight:700;color:var(--ink2);}
.wc-badge{font-size:11px;font-weight:800;padding:5px 12px;border-radius:20px;transition:all .3s var(--ease-spring);}
.wc-badge.up{color:#E85A3A;background:var(--peach-l);animation:slideLeft .5s var(--ease-out) both;}
.wc-badge.down{color:var(--sage);background:var(--sage-l);animation:slideLeft .5s var(--ease-out) both;}
.wc-big{display:flex;align-items:baseline;gap:5px;margin-bottom:4px;}
.wc-num{font-size:46px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1;color:var(--ink);}
.wc-unit{font-size:16px;color:var(--ink3);font-weight:600;}
.wc-sub{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;font-weight:500;}
.wc-sub .dot{width:6px;height:6px;border-radius:50%;background:var(--sage);animation:pulse 2s ease-in-out infinite;}
/* mini chart */
.mini-chart{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
.mini-label{font-size:11px;color:var(--ink3);font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;}
.chart-svg{width:100%;height:64px;display:block;}
.chart-line{fill:none;stroke:url(#cgrad);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:600;stroke-dashoffset:600;animation:drawLine 1.5s var(--ease-out) forwards;}
@keyframes drawLine{to{stroke-dashoffset:0;}}
.chart-dot{transition:all .3s var(--ease-spring);cursor:pointer;}
.chart-dot:hover{r:6;}

/* ===== Meals ===== */
.section{margin-bottom:20px;}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 4px;}
.sec-title{font-size:17px;font-weight:800;letter-spacing:-0.3px;display:flex;align-items:center;gap:8px;}
.sec-more{font-size:13px;color:var(--peach);font-weight:700;cursor:pointer;transition:all .2s;}
.sec-more:active{transform:scale(0.92);opacity:0.7;}
.meal-card{background:var(--bg2);border-radius:var(--r-md);margin-bottom:10px;box-shadow:var(--sh-sm);overflow:hidden;transition:all .3s var(--ease-spring);animation:popUp .5s var(--ease-out) both;}
.meal-card:active{transform:scale(0.97);box-shadow:var(--sh-md);}
.meal-row{display:flex;align-items:center;padding:15px 18px;gap:14px;}
.meal-icon{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;transition:transform .3s var(--ease-spring);}
.meal-card:active .meal-icon{transform:scale(1.1) rotate(-5deg);}
.meal-icon.breakfast{background:var(--lemon-l);}
.meal-icon.lunch{background:var(--peach-l);}
.meal-icon.dinner{background:var(--lilac-l);}
.meal-icon.snack{background:var(--sage-l);}
.meal-info{flex:1;min-width:0;}
.meal-name{font-size:15px;font-weight:700;margin-bottom:3px;}
.meal-detail{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;}
.meal-right{text-align:right;flex-shrink:0;}
.meal-kcal{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);}
.meal-kcal .u{font-size:10px;color:var(--ink3);font-weight:600;}
.meal-time{font-size:10px;color:var(--ink3);margin-top:2px;font-weight:500;}
.add-meal{width:100%;padding:16px;border-radius:var(--r-md);border:2px dashed var(--line);background:transparent;color:var(--ink3);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .25s var(--ease-spring);}
.add-meal:active{border-color:var(--peach);color:var(--peach);background:var(--peach-l);transform:scale(0.97);}
.add-meal svg{width:16px;height:16px;transition:transform .3s var(--ease-spring);}
.add-meal:active svg{transform:rotate(90deg);}

/* ===== Advice ===== */
.advice-card{background:linear-gradient(135deg,var(--sage-l),var(--bg2) 60%);border-radius:var(--r-lg);padding:20px;margin-bottom:16px;box-shadow:var(--sh-sm);position:relative;overflow:hidden;}
.advice-card::before{content:"💡";position:absolute;top:12px;right:16px;font-size:50px;opacity:0.06;}
.adv-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;position:relative;z-index:1;}
.adv-icon{width:36px;height:36px;border-radius:12px;background:var(--sage);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 10px rgba(127,182,158,0.3);}
.adv-title{font-size:15px;font-weight:800;color:var(--sage);}
.adv-good{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;position:relative;z-index:1;}
.g-tag{font-size:11px;font-weight:700;color:var(--sage);background:#fff;border-radius:16px;padding:5px 13px;box-shadow:var(--sh-sm);transition:all .25s var(--ease-spring);animation:popUp .4s var(--ease-out) both;}
.g-tag:active{transform:scale(0.92);}
.adv-tip{display:flex;gap:9px;padding:5px 0;font-size:12.5px;color:var(--ink2);line-height:1.7;font-weight:500;position:relative;z-index:1;}
.adv-tip .at-d{width:5px;height:5px;border-radius:50%;background:var(--sage);margin-top:8px;flex-shrink:0;opacity:0.5;}
.adv-final{margin-top:14px;font-size:12.5px;font-weight:700;color:var(--ink);background:var(--bg2);border-radius:var(--r-sm);padding:12px 16px;line-height:1.7;box-shadow:var(--sh-sm);position:relative;z-index:1;}

/* ===== Bottom Tab ===== */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,0.85);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);display:flex;justify-content:space-around;padding:10px 0 calc(var(--safe-b) + 10px);z-index:100;border-top:1px solid rgba(232,228,222,0.6);}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 18px;cursor:pointer;color:var(--ink3);transition:all .3s var(--ease-spring);border:none;background:none;font-family:inherit;position:relative;}
.tab-item svg{width:22px;height:22px;transition:transform .3s var(--ease-spring);}
.tab-item span{font-size:9px;font-weight:700;letter-spacing:0.3px;}
.tab-item.active{color:var(--peach);}
.tab-item.active svg{transform:translateY(-3px) scale(1.1);}
.tab-item:active{transform:scale(0.85);}

/* ===== FAB ===== */
.fab{position:fixed;right:calc(50% - 215px + 20px);bottom:calc(var(--safe-b) + 76px);width:58px;height:58px;border-radius:22px;background:linear-gradient(135deg,var(--peach),var(--coral));color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;box-shadow:0 8px 24px rgba(255,138,128,0.4);z-index:99;transition:all .3s var(--ease-spring);}
@media(max-width:430px){.fab{right:20px;}}
.fab:active{transform:scale(0.85) rotate(135deg);}
.fab svg{width:26px;height:26px;}
.fab::after{content:"";position:absolute;inset:-4px;border-radius:26px;border:2px solid var(--peach);opacity:0.3;animation:fabPulse 2.5s ease-in-out infinite;}
@keyframes fabPulse{0%,100%{transform:scale(1);opacity:0.3;}50%{transform:scale(1.08);opacity:0;}}

/* ===== Modal ===== */
.mo{position:fixed;inset:0;background:rgba(44,44,46,0.3);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s ease;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.mo.show{opacity:1;pointer-events:auto;}
.modal{background:var(--bg);border-radius:28px 28px 0 0;width:100%;max-width:430px;max-height:92vh;overflow-y:auto;padding:10px 20px calc(var(--safe-b) + 28px);transform:translateY(100%);transition:transform .5s var(--ease-out);scrollbar-width:none;border-top:1px solid rgba(255,255,255,0.5);}
.modal::-webkit-scrollbar{display:none;}
.mo.show .modal{transform:translateY(0);}
.modal-grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px;}
.m-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.m-title{font-size:21px;font-weight:800;letter-spacing:-0.4px;}
.m-close{width:36px;height:36px;border-radius:14px;background:var(--bg2);border:none;color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--sh-sm);transition:all .25s var(--ease-spring);}
.m-close:active{transform:scale(0.85) rotate(90deg);}
.m-close svg{width:14px;height:14px;}
.m-sec{margin-bottom:20px;}
.m-label{font-size:13px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.m-label .ml-e{font-size:15px;}
.meal-picker{display:flex;gap:10px;}
.mp{flex:1;padding:14px 4px;border-radius:var(--r-md);border:2px solid transparent;background:var(--bg2);font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;transition:all .3s var(--ease-spring);font-family:inherit;text-align:center;box-shadow:var(--sh-sm);}
.mp .mp-i{display:block;font-size:20px;margin-bottom:5px;transition:transform .3s var(--ease-spring);}
.mp:active{transform:scale(0.93);}
.mp.active{border-color:var(--peach);color:var(--peach);background:var(--peach-l);box-shadow:0 4px 14px rgba(255,159,124,0.2);}
.mp.active .mp-i{transform:scale(1.15);}
.m-input{width:100%;padding:16px;border-radius:var(--r-md);border:none;font-size:15px;font-family:inherit;background:var(--bg2);color:var(--ink);outline:none;transition:all .3s;line-height:1.7;resize:vertical;box-shadow:var(--sh-sm);}
.m-input:focus{box-shadow:var(--sh-md),0 0 0 3px var(--peach-l);}
.m-input::placeholder{color:var(--ink3);}
.pu{border:2.5px dashed var(--line);border-radius:var(--r-md);padding:28px;text-align:center;cursor:pointer;transition:all .3s var(--ease-spring);background:var(--bg2);}
.pu:active{border-color:var(--peach);background:var(--peach-l);transform:scale(0.97);}
.pu-icon{font-size:36px;margin-bottom:8px;transition:transform .3s var(--ease-spring);}
.pu:active .pu-icon{transform:scale(1.2);}
.pu-text{font-size:14px;font-weight:800;}
.pu-sub{font-size:11px;color:var(--ink3);margin-top:4px;font-weight:500;}
.pp{max-width:100%;border-radius:var(--r-md);margin-top:12px;display:none;box-shadow:var(--sh-md);animation:popUp .4s var(--ease-out);}
.pp.show{display:block;}
.an-btn{width:100%;padding:17px;border-radius:var(--r-md);border:none;background:linear-gradient(135deg,var(--peach),var(--coral));color:#fff;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 6px 20px rgba(255,138,128,0.35);transition:all .3s var(--ease-spring);display:flex;align-items:center;justify-content:center;gap:8px;}
.an-btn:active{transform:scale(0.96);}
.an-btn:disabled{opacity:0.5;pointer-events:none;}
.an-btn svg{width:18px;height:18px;}
.loading{text-align:center;padding:30px;display:none;}
.loading.show{display:block;}
.ld-icon{font-size:40px;animation:spin 1s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.ld-text{font-size:13px;color:var(--ink3);margin-top:12px;font-weight:600;}
.result{margin-top:16px;padding:20px;background:var(--bg2);border-radius:var(--r-md);display:none;animation:popUp .5s var(--ease-spring);box-shadow:var(--sh-md);}
.result.show{display:block;}
.ar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.ar-title{font-size:16px;font-weight:800;}
.ar-badge{font-size:10px;font-weight:800;padding:4px 12px;border-radius:14px;background:var(--sage-l);color:var(--sage);}
.ar-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line);animation:popUp .4s var(--ease-out) both;}
.ar-item .k{font-size:14px;color:var(--ink);font-weight:600;}
.ar-item .kd{font-size:11px;color:var(--ink3);display:block;margin-top:2px;font-weight:500;}

<script>
// Helpers
const safeNum=(v,fallback=0)=>{const n=Number(v);return isNaN(n)||!isFinite(n)?fallback:n;};
const loadEntriesSafe=()=>{try{const d=JSON.parse(localStorage.getItem("health_entries")||"{}");return(typeof d==="object"&&d)?d:{};}catch{return{};}};
try{const old=localStorage.getItem("health_entries");if(old&&(old.includes("NaN")||old.includes("undefined")))localStorage.removeItem("health_entries");}catch{}

const FOOD_DB={"米饭":{kcal:130,def:195},"面条":{kcal:110,def:330},"馒头":{kcal:220,def:110},"包子":{kcal:230,def:230},"饺子":{kcal:230,def:23},"面包":{kcal:280,def:80},"全麦面包":{kcal:250,def:75},"玉米":{kcal:110,def:120},"红薯":{kcal:100,def:150},"土豆":{kcal:80,def:130},"燕麦":{kcal:370,def:150},"鸡蛋":{kcal:145,def:75},"鸡胸肉":{kcal:133,def:133},"牛肉":{kcal:250,def:250},"猪肉":{kcal:400,def:200},"鱼肉":{kcal:150,def:150},"虾":{kcal:90,def:90},"虾仁":{kcal:90,def:90},"豆腐":{kcal:80,def:80},"牛奶":{kcal:65,def:130},"酸奶":{kcal:70,def:100},"豆浆":{kcal:30,def:60},"美式":{kcal:2,def:5},"咖啡":{kcal:2,def:5},"拿铁":{kcal:40,def:60},"苹果":{kcal:52,def:80},"香蕉":{kcal:90,def:90},"橙子":{kcal:47,def:70},"西红柿":{kcal:20,def:25},"黄瓜":{kcal:15,def:25},"西兰花":{kcal:35,def:35},"菠菜":{kcal:25,def:25},"白菜":{kcal:15,def:20},"生菜":{kcal:15,def:15},"萝卜":{kcal:20,def:25},"青椒":{kcal:20,def:25},"豆芽":{kcal:20,def:20},"芹菜":{kcal:15,def:20},"韭菜":{kcal:25,def:30},"茄子":{kcal:25,def:40},"冬瓜":{kcal:12,def:15},"南瓜":{kcal:25,def:40},"香菇":{kcal:30,def:30},"蘑菇":{kcal:25,def:25},"花生":{kcal:570,def:60},"核桃":{kcal:650,def:45},"饼干":{kcal:450,def:50},"蛋糕":{kcal:350,def:250},"巧克力":{kcal:550,def:150},"可乐":{kcal:45,def:100},"奶茶":{kcal:250,def:350},"果汁":{kcal:50,def:120},"披萨":{kcal:270,def:280},"汉堡":{kcal:250,def:500},"薯条":{kcal:310,def:300},"炒饭":{kcal:180,def:360},"炒面":{kcal:160,def:320},"粥":{kcal:45,def:90},"沙拉":{kcal:80,def:150},"山药":{kcal:55,def:80},"芋头":{kcal:80,def:100},"菱角":{kcal:100,def:50},"毛豆":{kcal:130,def:65},"豌豆":{kcal:110,def:55},"芦笋":{kcal:20,def:20},"西瓜":{kcal:30,def:60},"葡萄":{kcal:70,def:70},"草莓":{kcal:30,def:35},"蓝莓":{kcal:55,def:55},"桃子":{kcal:40,def:70},"梨":{kcal:50,def:80},"柚子":{kcal:40,def:100},"火龙果":{kcal:55,def:110},"猕猴桃":{kcal:60,def:40},"芒果":{kcal:60,def:100},"菠萝":{kcal:45,def:60},"辣条":{kcal:400,def:200},"冰淇淋":{kcal:200,def:200}};

// Multi-day data
const DATA_DAYS=[
{date:"2026-09-29",weekday:"周二",weight:{morning:72.0,evening:null,baseline:70.0,target:70.0,note:"比昨天下降1.4kg，水分回落中"},
meals:[{type:"早餐",time:"早上",kcal:145,items:[{name:"美式咖啡+纯牛奶",portion:"自制拿铁",kcal:70},{name:"全麦面包",portion:"1片",kcal:75}]}],
summary:{totalKcal:145,protein:8,carbs:20,fat:4},
advice:{good:["体重回落(↓1.4kg)","拿铁代替含糖咖啡","早餐清淡"],tips:["早餐可加个鸡蛋补蛋白","午餐晚餐正常吃","蔬菜今天还没吃","多喝水帮助代谢"],overall:"水分在消退，继续保持清淡饮食"}},
{date:"2026-09-28",weekday:"周一",weight:{morning:73.4,evening:73.8,baseline:70.0,target:70.0,note:"景德镇回来第一天，正在恢复"},
meals:[{type:"早餐",time:"早上",kcal:5,items:[{name:"自制美式咖啡",portion:"1杯",kcal:5}]},{type:"午餐",time:"中午",kcal:530,items:[{name:"蒜苗芦笋炒肉",portion:"~100g",kcal:80},{name:"芹菜黄瓜凉拌",portion:"~80g",kcal:25},{name:"小白菜香菇",portion:"~100g",kcal:60},{name:"青椒香菇肉片",portion:"~80g",kcal:110},{name:"豌豆虾仁蛋",portion:"~80g",kcal:100},{name:"凉拌豆芽",portion:"~80g",kcal:20},{name:"蒸玉米",portion:"~1/2根",kcal:60},{name:"米饭",portion:"半拳头",kcal:75}]},{type:"加餐",time:"下午",kcal:140,items:[{name:"全麦面包",portion:"1片",kcal:75},{name:"菱角",portion:"2个",kcal:40},{name:"西红柿",portion:"1个",kcal:25}]}],
summary:{totalKcal:675,protein:35,carbs:70,fat:18},
advice:{good:["蔬菜6份很棒","碳水控制合理","美式咖啡好"],tips:["蛋白质偏少","菱角计入碳水","热量偏低正常吃","避免含糖饮料","多喝水2000ml+"],overall:"适合减重期，补足蛋白质和水分"}}
];
const TODAY="2026-09-29";
let dayIdx=0;
const mealIcons={"早餐":{icon:"🌅",cls:"breakfast"},"午餐":{icon:"☀️",cls:"lunch"},"晚餐":{icon:"🌙",cls:"dinner"},"加餐":{icon:"🍰",cls:"snack"}};
const dayEn={"周一":"MON","周二":"TUE","周三":"WED","周四":"THU","周五":"FRI","周六":"SAT","周日":"SUN"};

// Header
const now=new Date();
const hour=now.getHours();
document.getElementById("greeting").textContent=hour<5?"夜深了 🌙":hour<12?"早上好 ☀️":hour<14?"中午好 🌤":hour<18?"下午好 ☁️":"晚上好 🌙";
document.getElementById("todayDate").textContent=`${TODAY} ${DATA_DAYS[0].weekday}`;

function navDay(dir){
const n=dayIdx+dir;
if(n<0||n>=DATA_DAYS.length){showToast(n<0?"已经是第一天了":"已经是今天啦");return;}
dayIdx=n;
renderDay(true);
}

function renderDay(animate){
const D=DATA_DAYS[dayIdx];
const isToday=D.date===TODAY;
document.getElementById("todayDate").textContent=`${D.date} ${D.weekday} · ${dayEn[D.weekday]||""}`;
document.getElementById("heroDate").textContent=`${D.date.slice(5)} ${D.weekday}`;
document.getElementById("heroLabel").textContent=isToday?"今日热量":`${D.weekday}热量`;
document.getElementById("mealsTitle").textContent=isToday?"今日饮食":`${D.weekday}饮食`;
document.getElementById("btnNextDay").disabled=isToday;

// Ring
const total=safeNum(D.summary.totalKcal,0),goal=2000;
const pct=Math.min(total/goal,1);
const offset=389*(1-pct);
document.getElementById("ringVal").style.strokeDashoffset=offset;
// Number count-up
const numEl=document.getElementById("ringNum");
let start=0;const step=Math.max(Math.ceil(total/25),1);
const anim=setInterval(()=>{start+=step;if(start>=total){start=total;clearInterval(anim);}numEl.textContent=start;},35);
document.getElementById("hiEaten").textContent=total+" kcal";
document.getElementById("hiLeft").textContent=Math.max(goal-total,0)+" kcal";
document.getElementById("hiProtein").textContent=safeNum(D.summary.protein,0)+"g";
document.getElementById("macroP").textContent=safeNum(D.summary.protein,0)+"g";
document.getElementById("macroC").textContent=safeNum(D.summary.carbs,0)+"g";
document.getElementById("macroF").textContent=safeNum(D.summary.fat,0)+"g";

// Macro progress bars
document.querySelectorAll(".macro-card").forEach(card=>{
const bar=card.querySelector("::before");
setTimeout(()=>{if(bar)bar.style.width="100%";},200);
});

// Weight
const w=D.weight;
document.getElementById("wcNum").textContent=safeNum(w.morning,0).toFixed(1);
const chg=safeNum(w.morning,0)-safeNum(w.baseline,0);
const badge=document.getElementById("wcBadge");
if(chg>0){badge.textContent=`↑ +${chg.toFixed(1)}kg`;badge.className="wc-badge up";}
else if(chg<0){badge.textContent=`↓ ${Math.abs(chg).toFixed(1)}kg`;badge.className="wc-badge down";}
else{badge.textContent="— 基线";badge.className="wc-badge";}
const diff=safeNum(w.morning,0)-safeNum(w.target,0);
document.getElementById("wcSub").textContent=diff>0?`第一阶段 ${w.target}kg · 还差 ${diff.toFixed(1)}kg`:"🎉 已达成第一阶段目标！";

// Chart
const weights=DATA_DAYS.map(d=>safeNum(d.weight.morning,0)).reverse();
const dates=DATA_DAYS.map(d=>d.date.slice(5)).reverse();
if(weights.length>=2){
const wMin=Math.min(...weights)-0.5,wMax=Math.max(...weights)+0.5,wR=wMax-wMin||1;
const CW=320,CH=56,CP=8;
const pts=weights.map((v,i)=>{
const x=CP+(i/(weights.length-1))*(CW-2*CP);
const y=CP+(1-(v-wMin)/wR)*(CH-2*CP);
return[x,y];
});
const line=pts.map(p=>p.join(",")).join(" ");
const area=`${CP},${CH-CP} ${line} ${CW-CP},${CH-CP}`;
const actI=weights.length-1-dayIdx;
document.getElementById("chartRange").textContent=weights.length+" 天";
document.getElementById("chartArea").innerHTML=`
<svg class="chart-svg" viewBox="0 0 ${CW} ${CH}" preserveAspectRatio="none">
<defs><linearGradient id="cgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FF9F7C" stop-opacity="0.15"/><stop offset="100%" stop-color="#FF9F7C" stop-opacity="0"/></linearGradient></defs>
<polygon points="${area}" fill="url(#cgrad)"/>
<polyline class="chart-line" points="${line}"/>
${pts.map((p,i)=>`<circle class="chart-dot" cx="${p[0]}" cy="${p[1]}" r="${i===actI?6:4}" fill="${i===actI?'var(--peach)':'var(--line)'}" stroke="var(--bg2)" stroke-width="2.5"/>`).join("")}
</svg>
<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--ink3);margin-top:6px;font-weight:600;">
${dates.map((d,i)=>`<span style="${i===actI?'color:var(--peach);font-weight:800;':''}">${d}</span>`).join("")}
</div>`;
}

// Meals
let mealsHtml="";
D.meals.forEach((meal,i)=>{
const mi=mealIcons[meal.type]||{icon:"🍽️",cls:"snack"};
const detail=meal.items.map(x=>x.name).join("、");
mealsHtml+=`<div class="meal-card" style="animation-delay:${i*0.08}s"><div class="meal-row">
<div class="meal-icon ${mi.cls}">${mi.icon}</div>
<div class="meal-info"><div class="meal-name">${meal.type}</div><div class="meal-detail">${detail}</div></div>

</div></div>`;
});
if(isToday)mealsHtml+=`<button class="add-meal" onclick="openModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>添加饮食记录</button>`;

// Tab
function switchTab(idx,el){
document.querySelectorAll(".tab-item").forEach(t=>t.classList.remove("active"));
el.classList.add("active");
if(idx===0)document.getElementById("content").scrollTo({top:0,behavior:"smooth"});
}

// Modal
let selMeal="早餐",photoB64=null,lastRes=null;
document.querySelectorAll(".mp").forEach(b=>{b.addEventListener("click",function(){document.querySelectorAll(".mp").forEach(x=>x.classList.remove("active"));this.classList.add("active");selMeal=this.dataset.meal;});});
function openModal(){document.getElementById("mo").classList.add("show");document.getElementById("result").classList.remove("show");document.getElementById("ld").classList.remove("show");document.getElementById("ab").disabled=false;document.body.style.overflow="hidden";}
function closeModal(){document.getElementById("mo").classList.remove("show");document.body.style.overflow="";}
document.getElementById("mo").addEventListener("click",e=>{if(e.target===e.currentTarget)closeModal();});
function previewPhoto(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const pp=document.getElementById("pp");pp.src=e.target.result;pp.classList.add("show");photoB64=e.target.result;};r.readAsDataURL(f);}

function analyzeText(text){
const lines=text.split(/[，,、;；\n]/).map(s=>s.trim()).filter(Boolean);
const items=[];let total=0;
lines.forEach(line=>{
let matched=false;
for(const[key,val]of Object.entries(FOOD_DB)){
if(line.includes(key)){
let p=val.def;
const q=line.match(/(\d+(?:\.\d+)?)\s*(个|碗|杯|片|根|块|份|把|包)/);
const h=line.match(/半\s*(个|碗|杯|片|根|块|份)/);
if(q)p=Math.round(val.def*parseFloat(q[1]));else if(h)p=Math.round(val.def*0.5);
items.push({name:key,detail:line,kcal:p});total+=p;matched=true;break;
}}
if(!matched){items.push({name:line,detail:"估算",kcal:80});total+=80;}
});
return{items,total};
}

async function analyze(){
const text=document.getElementById("fi").value.trim();
const btn=document.getElementById("ab");
if(!text&&!photoB64){showToast("请输入食物或拍照 📷");return;}
btn.disabled=true;document.getElementById("ld").classList.add("show");
document.getElementById("result").classList.remove("show");
await new Promise(r=>setTimeout(r,600));
let res;
if(photoB64){
try{
const resp=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(localStorage.getItem("openai_api_key")||"demo")},body:JSON.stringify({model:"gpt-4o-mini",messages:[{role:"user",content:[{type:"text",text:"识别图片中的所有食物，用中文回复，格式：食物名(分量) 热量kcal，每行一个。只列食物。"},{type:"image_url",image_url:{url:photoB64}}]}]}),max_tokens:500});
const data=await resp.json();
const aiText=data.choices?.[0]?.message?.content||"";
res=analyzeText(aiText||text||"食物");res.aiUsed=true;
}catch(e){res=analyzeText(text||"食物");res.aiError=true;}
}else{res=analyzeText(text);}
document.getElementById("ld").classList.remove("show");
btn.disabled=false;lastRes=res;
const badge=document.getElementById("arBadge");
if(res.aiUsed){badge.textContent="AI 识图";badge.style.display="";}
else if(res.aiError){badge.textContent="本地估算";badge.style.background="var(--peach-l)";badge.style.color="var(--peach)";badge.style.display="";}
else badge.style.display="none";
document.getElementById("ri").innerHTML=res.items.map((it,i)=>`<div class="ar-item" style="animation-delay:${i*0.06}s"><span class="k">${it.name}<span class="kd">${it.detail!==it.name?it.detail:""}</span></span><span class="v">${it.kcal} kcal</span></div>`).join("")+`<div class="ar-total"><span>总计</span><span class="v">${res.total} kcal</span></div>`;
document.getElementById("rs").innerHTML=`<div class="ar-sum">${getSummary(res.total)}</div>`;
document.getElementById("result").classList.add("show");
}
function getSummary(k){
if(k<100)return"🌱 热量很低，适合加餐或轻食";
if(k<300)return"👍 热量适中，一顿不错的餐食";
if(k<600)return"⚠️ 热量偏高，注意主食和油脂的量";
return"🔥 热量较高，建议减少主食或增加运动";
}
function copyRes(){if(!lastRes)return;
const curDate=DATA_DAYS[dayIdx].date;
const t=`帮我记录(${curDate})的饮食：\n${lastRes.items.map(i=>`• ${i.name}（${i.detail}）≈ ${i.kcal} kcal`).join("\n")}\n总计约 ${lastRes.total} kcal`;
if(navigator.share){navigator.share({text:t}).catch(()=>{navigator.clipboard.writeText(t).then(()=>showToast("已复制 💬"));});}
else{navigator.clipboard.writeText(t).then(()=>showToast("已复制，去粘贴给AI 💬"));}}
function saveLocal(){if(!lastRes)return;
const curDate=DATA_DAYS[dayIdx].date;
const entries=loadEntriesSafe();
if(!entries[curDate])entries[curDate]=[];
entries[curDate].push({type:selMeal,time:new Date().getHours()<12?"早上":(new Date().getHours()<18?"下午":"晚上"),kcal:lastRes.total,items:lastRes.items.map(i=>({name:i.name,portion:i.detail,kcal:i.kcal}))});
localStorage.setItem("health_entries",JSON.stringify(entries));
closeModal();showToast("已保存到今天 ✅");setTimeout(()=>location.reload(),800);}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800);}

renderDay();
</script>
