// ===== Quick Add =====
var addSelMeal="早餐";
var addFoodDB={"米饭":{def:195},"面条":{def:330},"馒头":{def:110},"包子":{def:230},"饺子":{def:23},"面包":{def:80},"全麦面包":{def:75},"玉米":{def:120},"红薯":{def:150},"土豆":{def:130},"燕麦":{def:150},"鸡蛋":{def:75},"鸡胸肉":{def:133},"牛肉":{def:250},"猪肉":{def:200},"鱼肉":{def:150},"虾":{def:90},"虾仁":{def:90},"豆腐":{def:80},"牛奶":{def:130},"酸奶":{def:100},"豆浆":{def:60},"美式":{def:5},"咖啡":{def:5},"拿铁":{def:60},"苹果":{def:80},"香蕉":{def:90},"橙子":{def:70},"西红柿":{def:25},"黄瓜":{def:25},"西兰花":{def:35},"菠菜":{def:25},"白菜":{def:20},"生菜":{def:15},"青椒":{def:25},"豆芽":{def:20},"芹菜":{def:20},"茄子":{def:40},"冬瓜":{def:15},"南瓜":{def:40},"香菇":{def:30},"蘑菇":{def:25},"花生":{def:60},"饼干":{def:50},"蛋糕":{def:250},"巧克力":{def:150},"可乐":{def:100},"奶茶":{def:350},"果汁":{def:120},"披萨":{def:280},"汉堡":{def:500},"薯条":{def:300},"炒饭":{def:360},"炒面":{def:320},"粥":{def:90},"沙拉":{def:150},"山药":{def:80},"芋头":{def:100},"菱角":{def:50},"毛豆":{def:65},"豌豆":{def:55},"芦笋":{def:20},"辣条":{def:200},"冰淇淋":{def:200}};

document.querySelectorAll("#addMealPicker .mp").forEach(function(b){
b.addEventListener("click",function(){
document.querySelectorAll("#addMealPicker .mp").forEach(function(x){x.classList.remove("active");});
this.classList.add("active");
addSelMeal=this.dataset.meal;
});
});

function openAddModal(){
document.getElementById("addMo").classList.add("show");
document.getElementById("addResult").classList.remove("show");
document.body.style.overflow="hidden";
}
function closeAddModal(){
document.getElementById("addMo").classList.remove("show");
document.body.style.overflow="";
}
document.getElementById("addMo").addEventListener("click",function(e){if(e.target===e.currentTarget)closeAddModal();});

function analyzeAddFood(){
var text=document.getElementById("addFoodInput").value.trim();
if(!text){showToast("请输入食物");return;}
var lines=text.split(/[，,、;；\n]/).filter(function(s){return s.trim();});
var items=[],total=0;
lines.forEach(function(line){
line=line.trim();var matched=false;
for(var key in addFoodDB){
if(line.indexOf(key)>=0){
var p=addFoodDB[key].def;
var q=line.match(/(\d+(?:\.\d+)?)\s*(个|碗|杯|片|根|块|份|把|包)/);
var h=line.match(/半\s*(个|碗|杯|片|根|块|份)/);
if(q)p=Math.round(addFoodDB[key].def*parseFloat(q[1]));
else if(h)p=Math.round(addFoodDB[key].def*0.5);
items.push({name:key,detail:line,kcal:p});total+=p;matched=true;break;
}}
if(!matched){items.push({name:line,detail:"估算",kcal:80});total+=80;}
});
var html="";
items.forEach(function(it){
html+="<div class='ar-item'><span>"+it.name+" ("+it.detail+")</span><span class='v'>"+it.kcal+" kcal</span></div>";
});
html+="<div class='ar-total'><span>总计</span><span class='v'>"+total+" kcal</span></div>";
document.getElementById("addResultItems").innerHTML=html;
document.getElementById("addResultTotal").innerHTML="";
document.getElementById("addResult").classList.add("show");
window._addResult={items:items,total:total,meal:addSelMeal};
}

function saveMeal(){
if(!window._addResult)return;
var now=new Date();
var today=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
var day=DATA_DAYS.find(function(d){return d.date===today;});
if(!day){day={date:today,weekday:"周三",weight:{morning:0,evening:null,baseline:70,target:70},diet:[],summary:{totalKcal:0,protein:0,carbs:0,fat:0},advice:{good:[],tips:[],overall:""}};DATA_DAYS.unshift(day);}
var existing=day.diet.find(function(m){return m.meal===addSelMeal;});
if(!existing){day.diet.push({type:addSelMeal,time:"",kcal:window._addResult.total,items:window._addResult.items});}
else{window._addResult.items.forEach(function(item){existing.items.push(item);});existing.kcal+=window._addResult.total;}
day.summary.totalKcal=day.diet.reduce(function(s,m){return s+m.kcal;},0);
closeAddModal();
renderDay();
showToast("已保存");
}

function copyMealText(){
if(!window._addResult)return;
var now=new Date();
var today=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
var t="帮我记录("+today+")"+addSelMeal+"：\n"+window._addResult.items.map(function(i){return"• "+i.name+"("+i.detail+") ≈ "+i.kcal+" kcal";}).join("\n")+"\n总计约 "+window._addResult.total+" kcal";
if(navigator.share){navigator.share({text:t}).catch(function(){navigator.clipboard.writeText(t);});}
else{navigator.clipboard.writeText(t).then(function(){showToast("已复制");});}
}

<style>
:root {
  --paper: #FBF6EE;
  --paper2: #F5EDE0;
  --card: #FFFDF8;
  --ink: #3E3A33;
  --ink2: #6B6558;
  --ink3: #A69E8F;
  --line: #E8DFD0;
  --accent: #E8734A;
  --accent2: #D94F70;
  --sage: #7A9B76;
  --sage-l: #EDF3EC;
  --sky: #6B9BC3;
  --sky-l: #EBF2F7;
  --butter: #E5A84B;
  --butter-l: #FDF3E3;
  --rose: #D94F70;
  --rose-l: #FBEAEE;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; }
body {
  font-family: "PingFang SC", -apple-system, "Helvetica Neue", "Microsoft YaHei", sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  -webkit-user-select:none; user-select:none;
}

/* ===== Cover / Hero ===== */
.cover {
  max-width: 480px; margin: 0 auto;
  padding: 48px 24px 36px;
  text-align: center;
  position: relative;
}
.cover::before {
  content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width: 1px; height: 100%;
  background: repeating-linear-gradient(to bottom, transparent 0 6px, var(--line) 6px 7px);
  z-index: 0;
}
.cover > * { position: relative; z-index: 1; }
.cover-badge {
  display:inline-flex; align-items:center; gap:6px;
  font-size: 10px; letter-spacing: 3px; color: var(--ink3);
  text-transform: uppercase;
  border: 1px solid var(--line);
  border-radius: 20px; padding: 5px 16px;
  background: var(--card);
  margin-bottom: 18px;
}
.cover-title {
  font-size: 30px; font-weight: 800; letter-spacing: -0.5px;
  line-height: 1.2;
}
.cover-title em {
  font-style: normal; color: var(--accent);
  position: relative; display: inline-block;
}
.cover-title em::after {
  content:""; position:absolute; left:-2px; right:-2px; bottom:3px;
  height:8px; background: var(--butter-l);
  border-radius: 3px; z-index:-1; transform: rotate(-1deg);
}
.cover-sub { font-size: 12px; color: var(--ink2); margin-top: 8px; line-height: 1.6; }

/* Cover stamp */
.stamp-row {
  display:flex; justify-content:center; gap:14px; margin-top:26px;
}
.stamp {
  background: var(--card);
  border-radius: 16px; padding: 14px 18px;
  min-width: 86px;
  box-shadow: 0 2px 10px rgba(62,58,51,0.05), 0 1px 3px rgba(62,58,51,0.04);
  border: 1px solid rgba(232,223,208,0.7);
  transition: transform .25s cubic-bezier(.32,.72,.32,1);
}
.stamp:active { transform: scale(0.96) rotate(-1deg); }
.stamp .s-num { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.stamp .s-num .u { font-size: 10px; font-weight: 500; color: var(--ink3); margin-left: 1px; }
.stamp .s-num.warn { color: var(--accent); }
.stamp .s-num.ok { color: var(--sage); }
.stamp .s-label { font-size: 9px; color: var(--ink3); margin-top: 3px; letter-spacing: 1px; }
.stamp.tilt-l { transform: rotate(-2deg); }
.stamp.tilt-l:active { transform: rotate(-2deg) scale(0.96); }
.stamp.tilt-r { transform: rotate(1.5deg); }
.stamp.tilt-r:active { transform: rotate(1.5deg) scale(0.96); }

/* Doodle divider */
.doodle-div {
  display:flex; align-items:center; gap:12px;
  max-width:480px; margin: 8px auto 0; padding: 0 24px;
}
.doodle-div .dd-line { flex:1; height:1px; background: var(--line); }
.doodle-div .dd-icon { font-size: 13px; opacity:0.5; }

/* ===== Timeline ===== */
.journal { max-width: 480px; margin: 0 auto; padding: 20px 20px 60px; position: relative; }
.journal::before {
  content:""; position:absolute; left: 34px; top: 40px; bottom: 60px;

/* Day entry */
.entry { position: relative; padding-left: 40px; margin-bottom: 36px; }
.entry:last-child { margin-bottom: 0; }

.date-pin {

/* Washi tape */
.page-card::before {

}
.entry.e3 .page-card::before {
  background: repeating-linear-gradient(45deg, rgba(122,155,118,0.18) 0 4px, rgba(122,155,118,0.10) 4px 8px);
}

/* Card head */
.pc-head {
  padding: 16px 18px 12px;
  display:flex; justify-content:space-between; align-items:flex-end;
  border-bottom: 1px dashed var(--line);
}
.pc-head .pc-date { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
.pc-head .pc-week { font-size: 10px; color: var(--ink3); margin-top: 2px; }
.pc-head .pc-weight {
  text-align: right; display:flex; align-items: baseline; gap:3px;
}
.pc-head .pc-w-num { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
.pc-head .pc-w-unit { font-size: 10px; color: var(--ink3); font-weight: 500; }
.pc-head .pc-w-chg {
  font-size: 9px; font-weight: 700;
  border-radius: 8px; padding: 2px 6px; margin-left: 5px;
  align-self: center;
}
.pc-w-chg.up { color: var(--accent); background: var(--butter-l); }
.pc-w-chg.down { color: var(--sage); background: var(--sage-l); }
.pc-w-chg.same { color: var(--ink3); background: var(--paper2); }

.pc-body { padding: 14px 18px 18px; }

/* Section */
.sec { margin-bottom: 16px; }
.sec:last-child { margin-bottom: 0; }
.sec-tag {
  display:inline-flex; align-items:center; gap:5px;

/* Weight tiles */
.w-row { display:flex; gap:10px; }
.w-box {
  flex:1; background: var(--paper); border-radius: 12px;
  padding: 12px 8px; text-align:center;
  border: 1px solid rgba(232,223,208,0.5);
}
.w-box .wb-ico { font-size: 15px; margin-bottom: 2px; }
.w-box .wb-label { font-size: 9px; color: var(--ink3); }
.w-box .wb-val { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; margin-top: 2px; }
.w-box .wb-val .u { font-size: 10px; font-weight: 400; color: var(--ink3); }

  margin-top: 8px; font-size: 10px; color: var(--ink2);

.adv-good { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px; }
.adv-good .g-tag {
  font-size: 9px; font-weight: 700;
  background:#fff; color: var(--sage);
  border-radius: 8px; padding: 4px 9px;
  border: 1px solid rgba(122,155,118,0.25);
}
.adv-tip { display:flex; gap:7px; padding:3px 0; }
.adv-tip .at-dot { width:4px; height:4px; border-radius:50%; background: var(--sage); margin-top:5.5px; flex-shrink:0; }
.adv-tip .at-txt { font-size: 10.5px; color: var(--ink2); line-height:1.6; }
.adv-final {
  margin-top: 10px; font-size: 10.5px; font-weight: 600; color: var(--sage);
  background: rgba(255,255,255,0.6); border-radius: 10px; padding: 8px 12px;
  border: 1px dashed rgba(122,155,118,0.3);
}

/* Footer */
.foot {
  text-align:center; padding: 10px 0 40px;
  font-size: 10px; color: var(--ink3); letter-spacing: 2px;
}
.foot .f-line { width: 40px; height:1px; background: var(--line); margin: 0 auto 10px; }

/* Float TOC button */
.toc-btn {
  position: fixed; right: 16px; bottom: 20px;
  width: 44px; height: 44px; border-radius: 14px;
  background: var(--ink); color: var(--paper);
  display:flex; align-items:center; justify-content:center;
  font-size: 18px; cursor:pointer;
  box-shadow: 0 4px 16px rgba(62,58,51,0.25);
  border: none; z-index: 50;
  transition: transform .2s;
}
.toc-btn:active { transform: scale(0.9); }

/* Toast */
.toast {
  position: fixed; bottom: 80px; left:50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--ink); color: var(--paper);
  font-size: 12px; padding: 8px 18px; border-radius: 20px;
  opacity:0; pointer-events:none;
  transition: all .3s cubic-bezier(.32,.72,.32,1);
  z-index: 100;
}
.toast.show { opacity:1; transform: translateX(-50%) translateY(0); }

/* Entry animations */
.entry { opacity: 0; transform: translateY(24px); transition: opacity .6s ease, transform .6s cubic-bezier(.32,.72,.32,1); }
.entry.visible { opacity: 1; transform: translateY(0); }

/* Top progress */
.read-progress {
  position: fixed; top: 0; left: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--rose));
  z-index: 60; transition: width .1s linear;
  border-radius: 0 2px 2px 0;
}

/* FAB */
.fab{position:fixed;right:20px;bottom:calc(var(--safe-b) + 20px);width:54px;height:54px;border-radius:18px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;box-shadow:0 6px 20px rgba(232,115,74,0.35);z-index:50;font-size:28px;font-weight:300;transition:transform .2s ease;}
.fab:active{transform:scale(0.85) rotate(90deg);}
/* Modal */
.mo{position:fixed;inset:0;background:rgba(44,44,46,0.3);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s ease;}
.mo.show{opacity:1;pointer-events:auto;}
.modal{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:430px;max-height:92vh;overflow-y:auto;padding:8px 20px calc(var(--safe-b) + 28px);transform:translateY(100%);transition:transform .4s cubic-bezier(.16,1,.3,1);}
.modal::-webkit-scrollbar{display:none;}
.mo.show .modal{transform:translateY(0);}
.modal-grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px;}
.m-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.m-title{font-size:19px;font-weight:800;color:var(--ink);}
.m-close{width:34px;height:34px;border-radius:50%;background:var(--bg);border:none;color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;}
.m-sec{margin-bottom:20px;}
.m-label{font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:8px;display:block;text-transform:uppercase;letter-spacing:1px;}
.meal-picker{display:flex;gap:8px;}
.mp{flex:1;padding:12px 4px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;text-align:center;transition:all .2s;}
.mp.active{border-color:var(--accent);color:var(--accent);background:rgba(232,115,74,0.08);}
.m-input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);font-size:15px;font-family:inherit;background:var(--card);color:var(--ink);outline:none;line-height:1.6;resize:vertical;}
.m-input:focus{border-color:var(--accent);}
.m-btn{width:100%;padding:16px;border-radius:16px;border:none;background:var(--accent);color:#fff;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(232,115,74,0.25);margin-top:8px;}
.result{margin-top:16px;padding:18px;background:var(--bg);border-radius:16px;display:none;}
.result.show{display:block;}
.ar-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;color:var(--ink2);}
.ar-item .v{font-weight:700;color:var(--accent);}
.ar-total{display:flex;justify-content:space-between;padding:12px 0 4px;font-size:15px;font-weight:800;color:var(--ink);}
.ar-total .v{color:var(--accent);font-size:18px;}
.ar-actions{display:flex;gap:10px;margin-top:14px;}
.ar-actions button{flex:1;padding:13px;border-radius:14px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.ar-save{background:var(--sage);color:#fff;}
.ar-copy{background:var(--bg);color:var(--ink2);border:1px solid var(--line);}
</style>
</head>
<body>

<div class="read-progress" id="progress"></div>

<!-- Cover -->
<div class="cover">
  <div class="cover-badge">📖 Health Journal</div>
  <div class="cover-title">我的<em>健康手账</em></div>
  <div class="cover-sub">记录体重与饮食 · 慢慢变好<br><span id="coverDate"></span></div>

  <div class="stamp-row">
    <div class="stamp tilt-l">
      <div class="s-num" id="stWeight">--<span class="u">kg</span></div>
      <div class="s-label">当前体重</div>
    </div>
    <div class="stamp">
      <div class="s-num warn" id="stChange">--<span class="u">kg</span></div>
      <div class="s-label">较基线</div>
    </div>
    <div class="stamp tilt-r">
      <div class="s-num" id="stDays">--</div>
      <div class="s-label">已记录</div>
    </div>
  </div>
</div>

<div class="doodle-div"><div class="dd-line"></div><div class="dd-icon">🌱</div><div class="dd-line"></div></div>

<!-- Journal entries -->
<div class="journal" id="journal"></div>

<div class="foot">
  <div class="f-line"></div>
  TO BE CONTINUED · 明天继续记录
</div>

<button class="toc-btn" id="tocBtn" onclick="scrollTop()">↑</button>
<div class="toast" id="toast"></div>

<script>
const D = TRACKER_DATA;

// Cover
const L = D.days[0];
const lw = L.weight;
document.getElementById("coverDate").textContent = `开始于 ${D.days[D.days.length-1].date} · 已有 ${D.days.length} 篇`;
document.getElementById("stWeight").innerHTML = `${lw.morning || lw.evening || "--"}<span class="u">kg</span>`;
const chg = lw.change || 0;
document.getElementById("stChange").innerHTML = `${chg>0?'+':''}${chg}<span class="u">kg</span>`;
document.getElementById("stDays").textContent = D.days.length;

// Meal meta
const mealMeta = {
  "早餐": { icon:"🍳", cls:"morning" },
  "午餐": { icon:"🍜", cls:"noon" },
  "晚餐": { icon:"🌙", cls:"night" },
  "加餐": { icon:"🍓", cls:"snack" }
};
const pinColors = ["", "e2", "e3"];
const dayNames = { "周一":"MON","周二":"TUE","周三":"WED","周四":"THU","周五":"FRI","周六":"SAT","周日":"SUN" };

// Build entries
const journal = document.getElementById("journal");
D.days.forEach((day, idx) => {
  const dw = day.weight;
  const wNum = dw.morning || dw.evening || "--";
  const cCls = dw.change > 0 ? "up" : (dw.change < 0 ? "down" : "same");
  const cTxt = dw.change > 0 ? `+${dw.change}kg` : (dw.change < 0 ? `${dw.change}kg` : "—");
  const pinTxt = day.date.slice(8); // day number
  const weekEn = dayNames[day.weekday] || "";
  const colorCls = pinColors[idx % 3];

  // Diet
  let dietHtml = "";
  day.diet.forEach(meal => {
    const meta = mealMeta[meal.meal] || { icon:"🍽️", cls:"snack" };
    let mealSum = 0;
    let foods = "";
    meal.items.forEach(item => {
      mealSum += item.kcal;
      foods += `<div class="food-line"><span class="f-name">${item.name}<span class="f-port">${item.portion}</span></span><span class="f-kcal">${item.kcal}</span></div>`;
    });
    dietHtml += `
      <div class="meal">
        <div class="meal-rail">
          <div class="m-dot ${meta.cls}">${meta.icon}</div>
          <div class="m-line"></div>
        </div>
        <div class="meal-info">
          <div class="meal-name">${meal.meal}<span class="m-time">${meal.time}</span><span class="m-sum">${mealSum} kcal</span></div>
          ${foods}
        </div>
      </div>`;
  });

  // Nutrition
  const s = day.summary;
  const nutriHtml = `
    <div class="nutri">
      <div class="nutri-cell"><div class="n-val total">${s.totalKcal}</div><div class="n-label">KCAL</div></div>
      <div class="nutri-cell"><div class="n-val p">${s.protein}</div><div class="n-label">蛋白</div></div>
      <div class="nutri-cell"><div class="n-val c">${s.carbs}</div><div class="n-label">碳水</div></div>
      <div class="nutri-cell"><div class="n-val f">${s.fat}</div><div class="n-label">脂肪</div></div>
    </div>`;

  // Advice
  const a = day.advice;
  const advHtml = `
    <div class="adv-card">
      <div class="adv-good">${a.good.map(g => `<span class="g-tag">✓ ${g}</span>`).join("")}</div>
      ${a.tips.map(t => `<div class="adv-tip"><div class="at-dot"></div><div class="at-txt">${t}</div></div>`).join("")}
      <div class="adv-final">📌 ${a.overall}</div>
    </div>`;

  const entry = document.createElement("div");
  entry.className = `entry ${colorCls}`;
  entry.innerHTML = `
    <div class="date-pin">${pinTxt}</div>
    <div class="page-card">
      <div class="pc-head">
        <div>
          <div class="pc-date">${day.date}</div>
          <div class="pc-week">${day.weekday} · ${weekEn}</div>
        </div>
        <div class="pc-weight">
          <span class="pc-w-num">${wNum}</span><span class="pc-w-unit">kg</span>
          <span class="pc-w-chg ${cCls}">${cTxt}</span>
        </div>
      </div>
      <div class="pc-body">
        <div class="sec">
          <div class="sec-tag t-w"><span class="st-line"></span>WEIGHT · 体重</div>
          <div class="w-row">
            <div class="w-box"><div class="wb-ico">🌅</div><div class="wb-label">早上</div><div class="wb-val">${dw.morning || "--"}<span class="u">kg</span></div></div>
            <div class="w-box"><div class="wb-ico">🌙</div><div class="wb-label">晚上</div><div class="wb-val">${dw.evening || "--"}<span class="u">kg</span></div></div>
          </div>
          ${dw.note ? `<div class="w-note">💬 ${dw.note}</div>` : ""}
        </div>
        <div class="sec">
          <div class="sec-tag t-d"><span class="st-line"></span>MEALS · 饮食</div>
          ${nutriHtml}
          ${dietHtml}
        </div>
        <div class="sec">
          <div class="sec-tag t-a"><span class="st-line"></span>NOTES · 建议</div>
          ${advHtml}
        </div>
      </div>
    </div>`;
  journal.appendChild(entry);
});

// Scroll animations
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("visible"); });
}, { threshold: 0.08 });
document.querySelectorAll(".entry").forEach(el => io.observe(el));

// Progress bar
window.addEventListener("scroll", () => {
  const h = document.documentElement;
  const pct = (h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100;
  document.getElementById("progress").style.width = pct + "%";
}, { passive: true });

function scrollTop() {
  window.scrollTo({ top: 0, behavior: "smooth" });
  showToast("回到顶部 ☝️");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1500);
}
</script>

<button class="fab" onclick="openAddModal()">+</button>
<div class="mo" id="addMo">
<div class="modal">
<div class="modal-grab"></div>
<div class="m-head"><div class="m-title">记录饮食</div><button class="m-close" onclick="closeAddModal()">✕</button></div>
<div class="m-sec"><div class="m-label">餐次</div><div class="meal-picker" id="addMealPicker">
<button class="mp active" data-meal="早餐">🌅 早餐</button>
<button class="mp" data-meal="午餐">☀️ 午餐</button>
<button class="mp" data-meal="晚餐">🌙 晚餐</button>
<button class="mp" data-meal="加餐">🍰 加餐</button>
</div></div>
<div class="m-sec"><div class="m-label">吃了什么</div>
<textarea class="m-input" id="addFoodInput" rows="3" placeholder="用逗号分隔，例如：米饭半碗，西兰花炒虾仁"></textarea>
</div>
<button class="m-btn" onclick="analyzeAddFood()">🔍 分析热量</button>
<div class="result" id="addResult">
<div id="addResultItems"></div>
<div id="addResultTotal"></div>
<div class="ar-actions">
<button class="ar-save" onclick="saveMeal()">💾 保存</button>
<button class="ar-copy" onclick="copyMealText()">💬 复制给AI</button>
</div>
</div>
</div>
</div>
</body>
</html>
