<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kcal · 卡路里管家</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
--bg:#F2EEE9;--bg2:#FFFFFF;--card:#FFFFFF;
--ink:#2C2C2E;--ink2:#6B6B70;--ink3:#AEAEB2;
--line:#E8E4DE;
--peach:#FF9F7C;--peach-l:#FFF3EE;
--sage:#7FB69E;--sage-l:#EEF6F2;
--lilac:#B8A9E8;--lilac-l:#F3EFFC;
--lemon:#F2C94C;--lemon-l:#FEFAEC;
--coral:#FF8A80;
--r-lg:20px;--r-md:16px;--r-sm:11px;
--sh-sm:0 2px 8px rgba(44,44,46,0.04);
--sh-md:0 4px 20px rgba(44,44,46,0.07);
--sh-lg:0 8px 32px rgba(44,44,46,0.10);
--ease-spring:cubic-bezier(.34,1.56,.64,1);
--ease-out:cubic-bezier(.16,1,.3,1);
--ease-smooth:cubic-bezier(.32,.72,.28,1);
--safe-t:env(safe-area-inset-top,0px);
--safe-b:env(safe-area-inset-bottom,0px);
}
html{font-size:16px;}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","PingFang SC","Nunito","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;background:transparent;color:var(--ink);height:100vh;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative;}
::-webkit-scrollbar{display:none;scrollbar-width:none;}

/* ===== Flowing gradient background ===== */
.bg-flow{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;pointer-events:none;z-index:0;
background:linear-gradient(120deg,#FAF7F2,#F8F5F0,#F5F4F0,#F8F5F2,#FAF7F2);
background-size:300% 300%;
animation:flowGradient 40s ease infinite;}
@keyframes flowGradient{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
/* Soft floating orbs */








/* ===== Header ===== */
.header{flex-shrink:0;padding:calc(var(--safe-t) + 12px) 20px 10px;width:100%;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2;}
.h-left{display:flex;align-items:center;gap:11px;}
.h-logo{width:42px;height:42px;border-radius:16px;background:linear-gradient(135deg,#E8734A,#D4907B);display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;box-shadow:0 4px 14px rgba(255,159,124,0.35);transition:transform .3s var(--ease-spring);}
.h-logo:active{transform:scale(0.9) rotate(-10deg);}
.h-greeting{font-size:16px;font-weight:800;letter-spacing:-0.3px;}
.h-date{font-size:11px;color:var(--ink2);margin-top:1px;font-weight:500;}
.h-right{display:flex;gap:8px;}
.h-btn{width:38px;height:38px;border-radius:14px;background:var(--bg2);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--sh-sm);transition:all .25s var(--ease-spring);color:var(--ink2);}
.h-btn svg{width:17px;height:17px;}
.h-btn:active{transform:scale(0.85);box-shadow:var(--sh-md);}

/* ===== Scroll content ===== */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 20px calc(var(--safe-b) + 100px);scrollbar-width:none;position:relative;z-index:1;width:100%;}
.content::-webkit-scrollbar{display:none;}

/* ===== Stagger animations ===== */
@keyframes popUp{from{opacity:0;transform:translateY(24px) scale(0.96);}to{opacity:1;transform:translateY(0) scale(1);}}
.pop{animation:popUp .55s var(--ease-out) both;}
@keyframes slideLeft{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}

/* ===== Calorie Hero ===== */
.hero{margin-bottom:16px;position:relative;width:100%;}
.hero-card{background:#FFFFFF;border-radius:var(--r-lg);padding:26px 22px;box-shadow:var(--sh-md);position:relative;overflow:hidden;}

.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;position:relative;z-index:1;}
.hero-label{font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;}
.hero-label .hl-dot{width:7px;height:7px;border-radius:50%;background:var(--primary);}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.3);opacity:0.6;}}
.hero-nav{display:flex;align-items:center;gap:6px;}
.date-nav{width:30px;height:30px;border-radius:11px;background:var(--bg);border:none;color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s var(--ease-spring);box-shadow:var(--sh-sm);padding:0;}
.date-nav svg{width:13px;height:13px;}
.date-nav:active{transform:scale(0.8);background:var(--peach-l);color:var(--peach);}
.date-nav:disabled{opacity:0.25;pointer-events:none;}
.hero-date-chip{font-size:11px;font-weight:700;color:var(--ink2);background:var(--bg);padding:6px 12px;border-radius:16px;box-shadow:var(--sh-sm);font-variant-numeric:tabular-nums;min-width:70px;text-align:center;}
.hero-main{display:flex;align-items:center;gap:22px;position:relative;z-index:1;}
.ring-wrap{position:relative;width:140px;height:140px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:#F5EAE2;stroke-width:11;}
.ring-val{fill:none;stroke:url(#rgrad);stroke-width:11;stroke-linecap:round;stroke-dasharray:389;stroke-dashoffset:389;transition:stroke-dashoffset 1.4s var(--ease-out);}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-num{font-size:36px;font-weight:800;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1;}
.ring-unit{font-size:9px;color:var(--ink3);font-weight:700;letter-spacing:1.5px;margin-top:5px;}
.hero-info{flex:1;display:flex;flex-direction:column;gap:0;}
.hi-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;}
.hi-row + .hi-row{border-top:1px dashed var(--line);}
.hi-label{font-size:12px;color:var(--ink2);font-weight:500;}
.hi-val{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;transition:color .3s;}
.hi-val.c1{color:var(--primary);} .hi-val.c2{color:var(--green);} .hi-val.c3{color:#B87A5E;}

/* ===== Macros ===== */
.macros{display:flex;gap:12px;margin-bottom:18px;width:100%;}
.macro-card{flex:1;background:#FFFFFF;border-radius:var(--r-md);padding:16px 10px;text-align:center;box-shadow:var(--sh-sm);transition:all .3s var(--ease-spring);position:relative;overflow:hidden;}
.macro-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;border-radius:4px 4px 0 0;transition:width 1s var(--ease-out);width:0%;}
.macro-card.p::before{background:var(--sage);}
.macro-card.c::before{background:var(--peach);}
.macro-card.f::before{background:var(--lilac);}
.macro-card:active{transform:scale(0.94) translateY(2px);box-shadow:var(--sh-md);}
.mc-icon{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 9px;font-size:17px;transition:transform .3s var(--ease-spring);}
.macro-card:active .mc-icon{transform:scale(1.15) rotate(8deg);}
.mc-icon.p{background:var(--sage-l);color:var(--sage);} .mc-icon.c{background:var(--peach-l);color:var(--peach);} .mc-icon.f{background:var(--lilac-l);color:var(--lilac);}
.mc-val{font-size:18px;font-weight:800;letter-spacing:-0.4px;font-variant-numeric:tabular-nums;}
.mc-val.p{color:var(--green);} .mc-val.c{color:var(--primary);} .mc-val.f{color:#B87A5E;}
.mc-label{font-size:10px;color:var(--ink3);margin-top:3px;font-weight:600;}

/* ===== Weight ===== */
.weight-card{background:#FFFFFF;border-radius:var(--r-lg);padding:22px;margin-bottom:18px;box-shadow:var(--sh-sm);position:relative;overflow:hidden;}

.wc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.wc-title{font-size:14px;font-weight:700;color:var(--ink2);}
.wc-badge{font-size:11px;font-weight:800;padding:5px 12px;border-radius:20px;transition:all .3s var(--ease-spring);}
.wc-badge.up{color:var(--primary);background:var(--orange-bg);animation:slideLeft .5s var(--ease-out) both;}
.wc-badge.down{color:var(--sage);background:var(--sage-l);animation:slideLeft .5s var(--ease-out) both;}
.wc-big{display:flex;align-items:baseline;gap:5px;margin-bottom:4px;}
.wc-num{font-size:48px;font-weight:850;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1;color:var(--ink);}
.wc-unit{font-size:16px;color:var(--ink3);font-weight:600;}
.wc-sub{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;font-weight:500;}
.wc-sub .dot{width:6px;height:6px;border-radius:50%;background:var(--sage);}
/* mini chart */
.mini-chart{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
.mini-label{font-size:11px;color:var(--ink3);font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;}
.chart-svg{width:100%;height:64px;display:block;}
.chart-line{fill:none;stroke:url(#cgrad);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:600;stroke-dashoffset:600;animation:drawLine 1.5s var(--ease-out) forwards;}
@keyframes drawLine{to{stroke-dashoffset:0;}}
.chart-dot{transition:all .3s var(--ease-spring);cursor:pointer;}
.chart-dot:hover{r:6;}

/* ===== Meals ===== */
.section{margin-bottom:20px;}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 4px;}
.sec-title{font-size:16px;font-weight:800;letter-spacing:-0.2px;display:flex;align-items:center;gap:8px;color:var(--ink);}
.sec-more{font-size:13px;color:var(--primary);font-weight:700;cursor:pointer;transition:all .2s;}
.sec-more:active{transform:scale(0.92);opacity:0.7;}
.meal-card{background:#FFFFFF;border-radius:var(--r-md);margin-bottom:10px;box-shadow:var(--sh-sm);overflow:hidden;transition:all .3s var(--ease-spring);animation:popUp .5s var(--ease-out) both;}
.meal-card:active{transform:scale(0.97);box-shadow:var(--sh-md);}
.meal-row{display:flex;align-items:center;padding:15px 18px;gap:14px;}
.meal-icon{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;transition:transform .3s var(--ease-spring);}
.meal-card:active .meal-icon{transform:scale(1.1) rotate(-5deg);}
.meal-icon.breakfast{background:#FBF3E0;color:#C49A3F;}
.meal-icon.lunch{background:#FDF1EA;color:var(--primary);}
.meal-icon.dinner{background:#F5EDEA;color:#B87A5E;}
.meal-icon.snack{background:#EBF3EE;color:var(--green);}
.meal-info{flex:1;min-width:0;}
.meal-name{font-size:15px;font-weight:700;margin-bottom:3px;}
.meal-detail{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;}
.meal-right{text-align:right;flex-shrink:0;}
.meal-kcal{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--primary);}
.meal-kcal .u{font-size:10px;color:var(--ink3);font-weight:600;}
.meal-time{font-size:10px;color:var(--ink3);margin-top:2px;font-weight:500;}

/* Expandable meal items */
.meal-items{max-height:0;overflow:hidden;transition:max-height .45s var(--ease-out);}
.meal-card.open .meal-items{max-height:500px;}
.mi-row{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-top:1px solid var(--line);animation:slideIn .3s var(--ease-out) both;}
.mi-row .mi-name{font-size:12px;color:var(--ink2);font-weight:600;}
.mi-row .mi-name .mi-port{font-size:10px;color:var(--ink3);margin-left:5px;font-weight:400;}
.mi-row .mi-kcal{font-size:13px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums;}
.meal-card.open .chev{transform:rotate(180deg);}
.chev{width:14px;height:14px;color:var(--ink3);transition:transform .3s var(--ease-spring);flex-shrink:0;margin-left:6px;}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
.add-meal{width:100%;padding:16px;border-radius:var(--r-md);border:2px dashed var(--line);background:transparent;color:var(--ink3);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .25s var(--ease-spring);}
.add-meal:active{border-color:var(--primary);color:var(--primary);background:#FDF1EA;transform:scale(0.97);}
.add-meal svg{width:16px;height:16px;transition:transform .3s var(--ease-spring);display:inline-block;vertical-align:middle;}
.add-meal:active svg{transform:rotate(90deg);}

/* ===== Advice ===== */
.advice-card{background:linear-gradient(135deg,#EEF6F2,#FFFFFF 60%);border-radius:var(--r-lg);padding:20px;margin-bottom:16px;box-shadow:var(--sh-sm);position:relative;overflow:hidden;}

.adv-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;position:relative;z-index:1;}
.adv-icon{width:36px;height:36px;border-radius:12px;background:var(--sage);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;box-shadow:0 3px 10px rgba(127,182,158,0.3);}
.adv-title{font-size:15px;font-weight:800;color:var(--green);}
.adv-good{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;position:relative;z-index:1;}
.g-tag{font-size:11px;font-weight:700;color:var(--green);background:#fff;border-radius:16px;padding:5px 13px;box-shadow:var(--sh-sm);transition:all .25s var(--ease-spring);animation:popUp .4s var(--ease-out) both;}
.g-tag:active{transform:scale(0.92);}
.adv-tip{display:flex;gap:9px;padding:5px 0;font-size:12.5px;color:var(--ink2);line-height:1.7;font-weight:500;position:relative;z-index:1;}
.adv-tip .at-d{width:5px;height:5px;border-radius:50%;background:var(--green);margin-top:8px;flex-shrink:0;opacity:0.5;}
.adv-final{margin-top:14px;font-size:12.5px;font-weight:700;color:var(--ink);background:var(--bg2);border-radius:var(--r-sm);padding:12px 16px;line-height:1.7;box-shadow:var(--sh-sm);position:relative;z-index:1;}

/* ===== Bottom Tab ===== */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,0.75);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);display:flex;justify-content:space-around;padding:10px 0 calc(var(--safe-b) + 10px);z-index:100;border-top:1px solid rgba(232,228,222,0.6);}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 18px;cursor:pointer;color:var(--ink3);transition:all .3s var(--ease-spring);border:none;background:none;font-family:inherit;position:relative;}
.tab-item svg{width:22px;height:22px;transition:transform .3s var(--ease-spring);}
.tab-item span{font-size:9px;font-weight:700;letter-spacing:0.3px;}
.tab-item.active{color:var(--peach);}
.tab-item.active svg{transform:translateY(-3px) scale(1.1);}
.tab-item:active{transform:scale(0.85);}

/* ===== FAB ===== */
.fab{position:fixed;right:calc(50% - 215px + 20px);bottom:calc(var(--safe-b) + 76px);width:58px;height:58px;border-radius:22px;background:linear-gradient(135deg,#E8734A,#D4907B);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;box-shadow:0 6px 20px rgba(232,115,74,0.3);z-index:99;transition:all .3s var(--ease-spring);}
@media(max-width:430px){.fab{right:20px;}}
.fab:active{transform:scale(0.85) rotate(135deg);}
.fab svg{width:26px;height:26px;}


/* ===== Modal ===== */
.mo{position:fixed;inset:0;background:rgba(44,44,46,0.3);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s ease;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.mo.show{opacity:1;pointer-events:auto;}
.modal{background:var(--bg);border-radius:28px 28px 0 0;width:100%;max-width:430px;max-height:92vh;overflow-y:auto;padding:10px 20px calc(var(--safe-b) + 28px);transform:translateY(100%);transition:transform .5s var(--ease-out);scrollbar-width:none;border-top:1px solid rgba(255,255,255,0.5);}
.modal::-webkit-scrollbar{display:none;}
.mo.show .modal{transform:translateY(0);}
.modal-grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px;}
.m-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.m-title{font-size:20px;font-weight:800;letter-spacing:-0.4px;}
.m-close{width:36px;height:36px;border-radius:14px;background:var(--bg2);border:none;color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--sh-sm);transition:all .25s var(--ease-spring);}
.m-close:active{transform:scale(0.85) rotate(90deg);}
.m-close svg{width:14px;height:14px;}
.m-sec{margin-bottom:20px;}
.m-label{font-size:13px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.m-label .ml-e{font-size:15px;}
.meal-picker{display:flex;gap:10px;}
.mp{flex:1;padding:14px 4px;border-radius:var(--r-md);border:2px solid transparent;background:var(--bg2);font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;transition:all .3s var(--ease-spring);font-family:inherit;text-align:center;box-shadow:var(--sh-sm);}
.mp .mp-i{display:block;font-size:20px;margin-bottom:5px;transition:transform .3s var(--ease-spring);}
.mp:active{transform:scale(0.93);}
.mp.active{border-color:var(--peach);color:var(--peach);background:var(--peach-l);box-shadow:0 4px 14px rgba(255,159,124,0.2);}
.mp.active .mp-i{transform:scale(1.15);}
.m-input{width:100%;padding:16px;border-radius:var(--r-md);border:none;font-size:15px;font-family:inherit;background:var(--bg2);color:var(--ink);outline:none;transition:all .3s;line-height:1.7;resize:vertical;box-shadow:var(--sh-sm);}
.m-input:focus{box-shadow:var(--sh-md),0 0 0 3px var(--peach-l);}
.m-input::placeholder{color:var(--ink3);}
.pu{border:2.5px dashed var(--line);border-radius:var(--r-md);padding:28px;text-align:center;cursor:pointer;transition:all .3s var(--ease-spring);background:var(--bg2);}
.pu:active{border-color:var(--peach);background:var(--peach-l);transform:scale(0.97);}
.pu-icon{font-size:36px;margin-bottom:8px;transition:transform .3s var(--ease-spring);}
.pu:active .pu-icon{transform:scale(1.2);}
.pu-text{font-size:14px;font-weight:800;}
.pu-sub{font-size:11px;color:var(--ink3);margin-top:4px;font-weight:500;}
.pp{max-width:100%;border-radius:var(--r-md);margin-top:12px;display:none;box-shadow:var(--sh-md);animation:popUp .4s var(--ease-out);}
.pp.show{display:block;}
.an-btn{width:100%;padding:17px;border-radius:var(--r-md);border:none;background:linear-gradient(135deg,#E8734A,#D4907B);color:#fff;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 6px 20px rgba(255,138,128,0.35);transition:all .3s var(--ease-spring);display:flex;align-items:center;justify-content:center;gap:8px;}
.an-btn:active{transform:scale(0.96);}
.an-btn:disabled{opacity:0.5;pointer-events:none;}
.an-btn svg{width:18px;height:18px;}
.loading{text-align:center;padding:30px;display:none;}
.loading.show{display:block;}
.ld-icon{font-size:40px;animation:spin 1s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.ld-text{font-size:13px;color:var(--ink3);margin-top:12px;font-weight:600;}
.result{margin-top:16px;padding:20px;background:var(--bg2);border-radius:var(--r-md);display:none;animation:popUp .5s var(--ease-spring);box-shadow:var(--sh-md);}
.result.show{display:block;}
.ar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.ar-title{font-size:16px;font-weight:800;}
.ar-badge{font-size:10px;font-weight:800;padding:4px 12px;border-radius:14px;background:var(--sage-l);color:var(--sage);}
.ar-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line);animation:popUp .4s var(--ease-out) both;}
.ar-item .k{font-size:14px;color:var(--ink);font-weight:600;}
.ar-item .kd{font-size:11px;color:var(--ink3);display:block;margin-top:2px;font-weight:500;}
.ar-item .v{font-weight:800;color:var(--peach);font-variant-numeric:tabular-nums;font-size:15px;}

.ar-save{background:linear-gradient(135deg,#E8734A,#D4907B);color:#fff;box-shadow:0 4px 14px rgba(255,138,128,0.3);}
.ar-copy{background:var(--bg2);color:var(--ink2);box-shadow:var(--sh-sm);}

/* Toast */
.toast{position:fixed;bottom:calc(var(--safe-b) + 92px);left:50%;transform:translateX(-50%) translateY(20px) scale(0.9);background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:12px 24px;border-radius:28px;opacity:0;pointer-events:none;transition:all .4s var(--ease-spring);z-index:300;white-space:nowrap;box-shadow:var(--sh-lg);max-width:85vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}

/* Views */
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;scrollbar-width:none;}
.view.active{display:block;}
.view .content::-webkit-scrollbar{display:none;}
.view .content{padding:0 20px calc(var(--safe-b) + 100px);}

/* Body Analysis */

.bc-l{font-size:13px;color:var(--ink2);font-weight:600;width:40px;flex-shrink:0;}

.bc-input::-webkit-inner-spin-button{-webkit-appearance:none;}
.bc-input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(232,115,74,0.08);}
.bc-u{font-size:12px;color:var(--ink3);font-weight:600;width:24px;flex-shrink:0;}

/* Journal */

// Helpers
const safeNum=(v,fallback=0)=>{const n=Number(v);return isNaN(n)||!isFinite(n)?fallback:n;};

function analyzeText(text){
const lines=text.split(/[，,、;；\n]/).map(s=>s.trim()).filter(Boolean);
const items=[];let total=0;
lines.forEach(line=>{
let matched=false;
for(const[key,val]of Object.entries(FOOD_DB)){
if(line.includes(key)){
let p=val.def;
const q=line.match(/(\d+(?:\.\d+)?)\s*(个|碗|杯|片|根|块|份|把|包)/);
const h=line.match(/半\s*(个|碗|杯|片|根|块|份)/);
if(q)p=Math.round(val.def*parseFloat(q[1]));else if(h)p=Math.round(val.def*0.5);
items.push({name:key,detail:line,kcal:p});total+=p;matched=true;break;
}}
if(!matched){items.push({name:line,detail:"估算",kcal:80});total+=80;}
});
return{items,total};
}

async function analyze(){

if(photoB64){
try{
const resp=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(localStorage.getItem("openai_api_key")||"demo")},body:JSON.stringify({model:"gpt-4o-mini",messages:[{role:"user",content:[{type:"text",text:"识别图片中的所有食物，用中文回复，格式：食物名(分量) 热量kcal，每行一个。只列食物。"},{type:"image_url",image_url:{url:photoB64}}]}]}),max_tokens:500});
const data=await resp.json();
const aiText=data.choices?.[0]?.message?.content||"";
res=analyzeText(aiText||text||"食物");res.aiUsed=true;
}catch(e){res=analyzeText(text||"食物");res.aiError=true;}

const badge=document.getElementById("arBadge");

else badge.style.display="none";
document.getElementById("ri").innerHTML=res.items.map((it,i)=>`<div class="ar-item" style="animation-delay:${i*0.06}s"><span class="k">${it.name}<span class="kd">${it.detail!==it.name?it.detail:""}</span></span><span class="v">${it.kcal} kcal</span></div>`).join("")+`<div class="ar-total"><span>总计</span><span class="v">${res.total} kcal</span></div>`;

function getSummary(k){
if(k<100)return"🌱 热量很低，适合加餐或轻食";
if(k<300)return"👍 热量适中，一顿不错的餐食";
if(k<600)return"⚠️ 热量偏高，注意主食和油脂的量";
return"🔥 热量较高，建议减少主食或增加运动";
}

const entries=loadEntriesSafe();
if(!entries[curDate])entries[curDate]=[];
entries[curDate].push({type:selMeal,time:new Date().getHours()<12?"早上":(new Date().getHours()<18?"下午":"晚上"),kcal:lastRes.total,items:lastRes.items.map(i=>({name:i.name,portion:i.detail,kcal:i.kcal}))});
localStorage.setItem("health_entries",JSON.stringify(entries));
closeModal();showToast("已保存 ✅");setTimeout(()=>location.reload(),800);}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800);}

function toggleMeal(card){card.classList.toggle("open");}

renderDay();

// ===== Tab switching =====
function switchTab(idx,el){
document.querySelectorAll(".tab-item").forEach(t=>t.classList.remove("active"));
el.classList.add("active");
document.getElementById("viewHome").classList.toggle("active",idx===0);
document.getElementById("viewBody").classList.toggle("active",idx===1);
document.getElementById("viewJournal").classList.toggle("active",idx===3);
if(idx===0)document.getElementById("content").scrollTo({top:0,behavior:"smooth"});
// Hide/show FAB
document.querySelector(".fab").style.display=(idx===0||idx===2)?"flex":"none";
}

// ===== Profile =====
let gender=0;
function setGender(g,btn){
gender=g;
document.querySelectorAll(".g-btn").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
saveProfile();
}
function saveProfile(){
const h=document.getElementById("inpHeight").value;
const w=document.getElementById("inpWeight").value;
const a=document.getElementById("inpAge").value;
localStorage.setItem("profile",JSON.stringify({height:h,weight:w,age:a,gender}));
}
function loadProfile(){
try{
const p=JSON.parse(localStorage.getItem("profile")||"{}");
if(p.height)document.getElementById("inpHeight").value=p.height;
if(p.weight)document.getElementById("inpWeight").value=p.weight;
if(p.age)document.getElementById("inpAge").value=p.age;
if(p.gender!==undefined){gender=p.gender;document.querySelectorAll(".g-btn").forEach((b,i)=>b.classList.toggle("active",i===p.gender));}
}catch{}
}

// ===== Body photo =====
let bodyPhotoB64=null;
function previewBody(input){
const f=input.files[0];if(!f)return;
const r=new FileReader();
r.onload=e=>{
const img=document.getElementById("bodyPreview");
img.src=e.target.result;img.style.display="block";
bodyPhotoB64=e.target.result;
};
r.readAsDataURL(f);
}

function analyzeBody(){
const h=document.getElementById("inpHeight").value;
const w=document.getElementById("inpWeight").value;
const a=document.getElementById("inpAge").value;
if(!h||!w){showToast("请先填写身高和体重");return;}
const bmi=(parseFloat(w)/Math.pow(parseFloat(h)/100,2)).toFixed(1);
const result=document.getElementById("bodyResult");
let status,advice,color;
if(bmi<18.5){status="偏瘦";color="var(--blue)";advice="适当增加优质蛋白和力量训练";}
else if(bmi<24){status="正常";color="var(--green)";advice="保持当前状态，注意体脂率";}
else if(bmi<28){status="偏胖";color="var(--orange)";advice="控制碳水+有氧运动，目标减5-8kg";}
else{status="肥胖";color="var(--red)";advice="建议制定详细减重计划，必要时咨询医生";}
result.innerHTML=`
<div class="ar-head"><div class="ar-title">📊 分析结果</div><div class="ar-badge" style="background:var(--green-bg);color:var(--green);">BMI ${bmi}</div></div>
<div style="font-size:32px;font-weight:800;margin:10px 0;color:${color};">${status}</div>
<div style="font-size:13px;color:var(--ink2);line-height:1.7;">${advice}</div>
<div style="margin-top:14px;padding:12px;background:var(--bg);border-radius:12px;font-size:12px;color:var(--ink2);line-height:1.7;">
💡 想要更精确的体型分析，可以拍一张全身照发到对话框，AI 会根据照片分析体型比例、脂肪分布，并给出具体的穿搭建议和减肥方向。
</div>`;
result.classList.add("show");
}

// ===== Journal =====
const INITIAL_EVENTS=[
{date:"2026-09-25",type:"travel",title:"去了景德镇玩3天",desc:"中秋假期去了景德镇，来回吃了泡面，中间3天吃了江西菜，喝了超级多的水和饮料，天气特别热。",impact:"体重从 ~70kg 涨到 73.8kg，胖了约 <b>6斤</b>"},
{date:"2026-09-27",type:"milestone",title:"开始记录体重",desc:"从景德镇回来后开始认真记录体重，目标是回到70kg。"},
{date:"2026-09-29",type:"milestone",title:"体重降到72.0kg",desc:"比昨天早上降了1.4kg，水分在消退，继续保持清淡饮食。",impact:"距离第一阶段目标 70kg 还差 <b>2kg</b>"}
];
function loadEvents(){
try{
const saved=JSON.parse(localStorage.getItem("journal_events")||"null");
if(saved&&Array.isArray(saved)&&saved.length>0)return saved;
}catch(e){}
localStorage.setItem("journal_events",JSON.stringify(INITIAL_EVENTS));
return INITIAL_EVENTS;
}
function renderJournal(){
const events=loadEvents();
const typeLabels={travel:"✈️ 旅行",feast:"🎉 聚餐",milestone:"🎯 里程碑",other:"📝 事件"};
const typeCls={travel:"travel",feast:"feast",milestone:"milestone",other:"other"};
const el=document.getElementById("journalTimeline");
el.innerHTML=events.map((e,i)=>`<div class="journal-entry" style="animation-delay:${i*0.06}s"><div class="je-date">${e.date} <span class="je-type ${typeCls[e.type]||"other"}">${typeLabels[e.type]||typeLabels.other}</span></div><div class="je-title">${e.title}</div>${e.desc?`<div class="je-desc">${e.desc}</div>`:""}${e.impact?`<div class="je-impact">📉 ${e.impact}</div>`:""}</div>`).join("");
}
function addEvent(){
document.getElementById("evtDate").value=TODAY;
document.getElementById("evtTitle").value="";
document.getElementById("evtDesc").value="";
document.getElementById("eventMo").classList.add("show");
document.body.style.overflow="hidden";
}
function closeEvent(){document.getElementById("eventMo").classList.remove("show");document.body.style.overflow="";}
document.getElementById("eventMo").addEventListener("click",e=>{if(e.target===e.currentTarget)closeEvent();});
document.querySelectorAll("#evtType .mp").forEach(b=>{b.addEventListener("click",function(){document.querySelectorAll("#evtType .mp").forEach(x=>x.classList.remove("active"));this.classList.add("active");});});
function saveEvent(){
const title=document.getElementById("evtTitle").value.trim();
if(!title){showToast("请输入标题");return;}
const events=loadEvents();
events.push({
date:document.getElementById("evtDate").value||TODAY,
type:document.querySelector("#evtType .mp.active").dataset.type,
title:title,
desc:document.getElementById("evtDesc").value.trim(),
impact:""
});
localStorage.setItem("journal_events",JSON.stringify(events));
closeEvent();
renderJournal();
showToast("已记录到日记 ✅");
}
loadProfile();
renderJournal();
</script>
