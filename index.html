<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的健康手账</title>
<script src="data.js"></script>
<style>
:root {
  --paper: #FBF6EE;
  --paper2: #F5EDE0;
  --card: #FFFDF8;
  --ink: #3E3A33;
  --ink2: #6B6558;
  --ink3: #A69E8F;
  --line: #E8DFD0;
  --accent: #E8734A;
  --accent2: #D94F70;
  --sage: #7A9B76;
  --sage-l: #EDF3EC;
  --sky: #6B9BC3;
  --sky-l: #EBF2F7;
  --butter: #E5A84B;
  --butter-l: #FDF3E3;
  --rose: #D94F70;
  --rose-l: #FBEAEE;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; }
body {
  font-family: "PingFang SC", -apple-system, "Helvetica Neue", "Microsoft YaHei", sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  -webkit-user-select:none; user-select:none;
}

/* ===== Cover / Hero ===== */
.cover {
  max-width: 480px; margin: 0 auto;
  padding: 48px 24px 36px;
  text-align: center;
  position: relative;
}
.cover::before {
  content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width: 1px; height: 100%;
  background: repeating-linear-gradient(to bottom, transparent 0 6px, var(--line) 6px 7px);
  z-index: 0;
}
.cover > * { position: relative; z-index: 1; }
.cover-badge {
  display:inline-flex; align-items:center; gap:6px;
  font-size: 10px; letter-spacing: 3px; color: var(--ink3);
  text-transform: uppercase;
  border: 1px solid var(--line);
  border-radius: 20px; padding: 5px 16px;
  background: var(--card);
  margin-bottom: 18px;
}
.cover-title {
  font-size: 30px; font-weight: 800; letter-spacing: -0.5px;
  line-height: 1.2;
}
.cover-title em {
  font-style: normal; color: var(--accent);
  position: relative; display: inline-block;
}
.cover-title em::after {
  content:""; position:absolute; left:-2px; right:-2px; bottom:3px;
  height:8px; background: var(--butter-l);
  border-radius: 3px; z-index:-1; transform: rotate(-1deg);
}
.cover-sub { font-size: 12px; color: var(--ink2); margin-top: 8px; line-height: 1.6; }

/* Cover stamp */
.stamp-row {
  display:flex; justify-content:center; gap:14px; margin-top:26px;
}
.stamp {
  background: var(--card);
  border-radius: 16px; padding: 14px 18px;
  min-width: 86px;
  box-shadow: 0 2px 10px rgba(62,58,51,0.05), 0 1px 3px rgba(62,58,51,0.04);
  border: 1px solid rgba(232,223,208,0.7);
  transition: transform .25s cubic-bezier(.32,.72,.32,1);
}
.stamp:active { transform: scale(0.96) rotate(-1deg); }
.stamp .s-num { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.stamp .s-num .u { font-size: 10px; font-weight: 500; color: var(--ink3); margin-left: 1px; }
.stamp .s-num.warn { color: var(--accent); }
.stamp .s-num.ok { color: var(--sage); }
.stamp .s-label { font-size: 9px; color: var(--ink3); margin-top: 3px; letter-spacing: 1px; }
.stamp.tilt-l { transform: rotate(-2deg); }
.stamp.tilt-l:active { transform: rotate(-2deg) scale(0.96); }
.stamp.tilt-r { transform: rotate(1.5deg); }
.stamp.tilt-r:active { transform: rotate(1.5deg) scale(0.96); }

/* Doodle divider */
.doodle-div {
  display:flex; align-items:center; gap:12px;
  max-width:480px; margin: 8px auto 0; padding: 0 24px;
}
.doodle-div .dd-line { flex:1; height:1px; background: var(--line); }
.doodle-div .dd-icon { font-size: 13px; opacity:0.5; }

/* ===== Timeline ===== */
.journal { max-width: 480px; margin: 0 auto; padding: 20px 20px 60px; position: relative; }
.journal::before {
  content:""; position:absolute; left: 34px; top: 40px; bottom: 60px;
  width: 2px;
  background: repeating-linear-gradient(to bottom, var(--line) 0 8px, transparent 8px 14px);
  border-radius: 1px;
}

/* Day entry */
.entry { position: relative; padding-left: 40px; margin-bottom: 36px; }
.entry:last-child { margin-bottom: 0; }

/* Date pin */
.date-pin {
  position: absolute; left: 0; top: 2px;
  width: 28px; height: 28px;
  background: var(--accent);
  border-radius: 50% 50% 50% 4px;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size: 10px; font-weight: 800;
  box-shadow: 0 3px 8px rgba(232,115,74,0.3);
  z-index: 2;
}
.entry.e2 .date-pin { background: var(--sky); box-shadow: 0 3px 8px rgba(107,155,195,0.3); }
.entry.e3 .date-pin { background: var(--sage); box-shadow: 0 3px 8px rgba(122,155,118,0.3); }

/* Page card */
.page-card {
  background: var(--card);
  border-radius: 4px 18px 18px 18px;
  border: 1px solid rgba(232,223,208,0.6);
  box-shadow: 0 4px 20px rgba(62,58,51,0.06), 0 1px 3px rgba(62,58,51,0.04);
  overflow: hidden;
  position: relative;
}
/* Washi tape */
.page-card::before {
  content:"";
  position: absolute; top: -6px; right: 24px;
  width: 58px; height: 16px;
  background: repeating-linear-gradient(45deg, rgba(232,115,74,0.18) 0 4px, rgba(232,115,74,0.10) 4px 8px);
  border-radius: 1px;
  transform: rotate(3deg);
  z-index: 3;
}
.entry.e2 .page-card::before {
  background: repeating-linear-gradient(45deg, rgba(107,155,195,0.18) 0 4px, rgba(107,155,195,0.10) 4px 8px);
}
.entry.e3 .page-card::before {
  background: repeating-linear-gradient(45deg, rgba(122,155,118,0.18) 0 4px, rgba(122,155,118,0.10) 4px 8px);
}

/* Card head */
.pc-head {
  padding: 16px 18px 12px;
  display:flex; justify-content:space-between; align-items:flex-end;
  border-bottom: 1px dashed var(--line);
}
.pc-head .pc-date { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
.pc-head .pc-week { font-size: 10px; color: var(--ink3); margin-top: 2px; }
.pc-head .pc-weight {
  text-align: right; display:flex; align-items: baseline; gap:3px;
}
.pc-head .pc-w-num { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
.pc-head .pc-w-unit { font-size: 10px; color: var(--ink3); font-weight: 500; }
.pc-head .pc-w-chg {
  font-size: 9px; font-weight: 700;
  border-radius: 8px; padding: 2px 6px; margin-left: 5px;
  align-self: center;
}
.pc-w-chg.up { color: var(--accent); background: var(--butter-l); }
.pc-w-chg.down { color: var(--sage); background: var(--sage-l); }
.pc-w-chg.same { color: var(--ink3); background: var(--paper2); }

.pc-body { padding: 14px 18px 18px; }

/* Section */
.sec { margin-bottom: 16px; }
.sec:last-child { margin-bottom: 0; }
.sec-tag {
  display:inline-flex; align-items:center; gap:5px;
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  color: var(--ink3); text-transform: uppercase;
  margin-bottom: 10px;
}
.sec-tag .st-line { width: 16px; height: 2px; border-radius: 1px; }
.sec-tag.t-w .st-line { background: var(--sky); }
.sec-tag.t-d .st-line { background: var(--butter); }
.sec-tag.t-a .st-line { background: var(--sage); }

/* Weight tiles */
.w-row { display:flex; gap:10px; }
.w-box {
  flex:1; background: var(--paper); border-radius: 12px;
  padding: 12px 8px; text-align:center;
  border: 1px solid rgba(232,223,208,0.5);
}
.w-box .wb-ico { font-size: 15px; margin-bottom: 2px; }
.w-box .wb-label { font-size: 9px; color: var(--ink3); }
.w-box .wb-val { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; margin-top: 2px; }
.w-box .wb-val .u { font-size: 10px; font-weight: 400; color: var(--ink3); }
.w-note {
  margin-top: 8px; font-size: 10px; color: var(--ink2);
  background: var(--paper); border-radius: 10px; padding: 7px 12px;
  text-align:center; border: 1px dashed var(--line);
}

/* Nutrition strip */
.nutri {
  display:flex; gap:0; background: var(--paper);
  border-radius: 12px; overflow:hidden;
  border: 1px solid rgba(232,223,208,0.5);
  margin-bottom: 12px;
}
.nutri-cell {
  flex:1; text-align:center; padding: 10px 4px;
  position:relative;
}
.nutri-cell:not(:last-child)::after {
  content:""; position:absolute; right:0; top:25%; height:50%;
  width:1px; background: var(--line);
}
.nutri-cell .n-val { font-size: 15px; font-weight: 800; letter-spacing:-0.3px; }
.nutri-cell .n-val.total { color: var(--accent); font-size: 17px; }
.nutri-cell .n-val.p { color: var(--sky); }
.nutri-cell .n-val.c { color: var(--butter); }
.nutri-cell .n-val.f { color: var(--rose); }
.nutri-cell .n-label { font-size: 8px; color: var(--ink3); margin-top: 2px; letter-spacing: 1px; }

/* Meal entries */
.meal { display:flex; gap:12px; margin-bottom: 12px; }
.meal:last-child { margin-bottom:0; }
.meal-rail { display:flex; flex-direction:column; align-items:center; width:34px; flex-shrink:0; }
.meal-rail .m-dot {
  width: 28px; height: 28px; border-radius: 50%;
  display:flex; align-items:center; justify-content:center;
  font-size: 12px; flex-shrink: 0;
  border: 2px solid var(--card);
  box-shadow: 0 0 0 1.5px var(--line);
}
.meal-rail .m-line { flex:1; width:1.5px; background: var(--line); margin-top:3px; }
.m-dot.morning { background: var(--butter-l); }
.m-dot.noon { background: var(--sky-l); }
.m-dot.snack { background: var(--rose-l); }
.m-dot.night { background: #EDE9FE; }
.meal-info { flex:1; min-width:0; }
.meal-name { font-size: 12px; font-weight: 700; margin-bottom: 5px; display:flex; align-items:baseline; gap:6px; }
.meal-name .m-time { font-size: 9px; color: var(--ink3); font-weight: 400; }
.meal-name .m-sum { font-size: 9px; color: var(--accent); font-weight: 700; margin-left:auto; }
.food-line {
  display:flex; align-items:center; justify-content:space-between;
  font-size: 11px; color: var(--ink2);
  padding: 4px 0; border-bottom: 1px dashed rgba(232,223,208,0.6);
}
.food-line:last-child { border-bottom:none; }
.food-line .f-name .f-port { font-size: 9px; color: var(--ink3); margin-left: 4px; }
.food-line .f-kcal { font-size: 10px; font-weight: 700; color: var(--butter); }

/* Advice */
.adv-card {
  background: var(--sage-l);
  border-radius: 14px; padding: 14px;
  border: 1px solid rgba(122,155,118,0.15);
}
.adv-good { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px; }
.adv-good .g-tag {
  font-size: 9px; font-weight: 700;
  background:#fff; color: var(--sage);
  border-radius: 8px; padding: 4px 9px;
  border: 1px solid rgba(122,155,118,0.25);
}
.adv-tip { display:flex; gap:7px; padding:3px 0; }
.adv-tip .at-dot { width:4px; height:4px; border-radius:50%; background: var(--sage); margin-top:5.5px; flex-shrink:0; }
.adv-tip .at-txt { font-size: 10.5px; color: var(--ink2); line-height:1.6; }
.adv-final {
  margin-top: 10px; font-size: 10.5px; font-weight: 600; color: var(--sage);
  background: rgba(255,255,255,0.6); border-radius: 10px; padding: 8px 12px;
  border: 1px dashed rgba(122,155,118,0.3);
}

/* Footer */
.foot {
  text-align:center; padding: 10px 0 40px;
  font-size: 10px; color: var(--ink3); letter-spacing: 2px;
}
.foot .f-line { width: 40px; height:1px; background: var(--line); margin: 0 auto 10px; }

/* Float TOC button */
.toc-btn {
  position: fixed; right: 16px; bottom: 20px;
  width: 44px; height: 44px; border-radius: 14px;
  background: var(--ink); color: var(--paper);
  display:flex; align-items:center; justify-content:center;
  font-size: 18px; cursor:pointer;
  box-shadow: 0 4px 16px rgba(62,58,51,0.25);
  border: none; z-index: 50;
  transition: transform .2s;
}
.toc-btn:active { transform: scale(0.9); }

/* Toast */
.toast {
  position: fixed; bottom: 80px; left:50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--ink); color: var(--paper);
  font-size: 12px; padding: 8px 18px; border-radius: 20px;
  opacity:0; pointer-events:none;
  transition: all .3s cubic-bezier(.32,.72,.32,1);
  z-index: 100;
}
.toast.show { opacity:1; transform: translateX(-50%) translateY(0); }

/* Entry animations */
.entry { opacity: 0; transform: translateY(24px); transition: opacity .6s ease, transform .6s cubic-bezier(.32,.72,.32,1); }
.entry.visible { opacity: 1; transform: translateY(0); }

/* Top progress */
.read-progress {
  position: fixed; top: 0; left: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--rose));
  z-index: 60; transition: width .1s linear;
  border-radius: 0 2px 2px 0;
}
</style>
</head>
<body>

<div class="read-progress" id="progress"></div>

<!-- Cover -->
<div class="cover">
  <div class="cover-badge">📖 Health Journal</div>
  <div class="cover-title">我的<em>健康手账</em></div>
  <div class="cover-sub">记录体重与饮食 · 慢慢变好<br><span id="coverDate"></span></div>

  <div class="stamp-row">
    <div class="stamp tilt-l">
      <div class="s-num" id="stWeight">--<span class="u">kg</span></div>
      <div class="s-label">当前体重</div>
    </div>
    <div class="stamp">
      <div class="s-num warn" id="stChange">--<span class="u">kg</span></div>
      <div class="s-label">较基线</div>
    </div>
    <div class="stamp tilt-r">
      <div class="s-num" id="stDays">--</div>
      <div class="s-label">已记录</div>
    </div>
  </div>
</div>

<div class="doodle-div"><div class="dd-line"></div><div class="dd-icon">🌱</div><div class="dd-line"></div></div>

<!-- Journal entries -->
<div class="journal" id="journal"></div>

<div class="foot">
  <div class="f-line"></div>
  TO BE CONTINUED · 明天继续记录
</div>

<button class="toc-btn" id="tocBtn" onclick="scrollTop()">↑</button>
<div class="toast" id="toast"></div>

<script>
const D = TRACKER_DATA;

// Cover
const L = D.days[0];
const lw = L.weight;
document.getElementById("coverDate").textContent = `开始于 ${D.days[D.days.length-1].date} · 已有 ${D.days.length} 篇`;
document.getElementById("stWeight").innerHTML = `${lw.morning || lw.evening || "--"}<span class="u">kg</span>`;
const chg = lw.change || 0;
document.getElementById("stChange").innerHTML = `${chg>0?'+':''}${chg}<span class="u">kg</span>`;
document.getElementById("stDays").textContent = D.days.length;

// Meal meta
const mealMeta = {
  "早餐": { icon:"🍳", cls:"morning" },
  "午餐": { icon:"🍜", cls:"noon" },
  "晚餐": { icon:"🌙", cls:"night" },
  "加餐": { icon:"🍓", cls:"snack" }
};
const pinColors = ["", "e2", "e3"];
const dayNames = { "周一":"MON","周二":"TUE","周三":"WED","周四":"THU","周五":"FRI","周六":"SAT","周日":"SUN" };

// Build entries
const journal = document.getElementById("journal");
D.days.forEach((day, idx) => {
  const dw = day.weight;
  const wNum = dw.morning || dw.evening || "--";
  const cCls = dw.change > 0 ? "up" : (dw.change < 0 ? "down" : "same");
  const cTxt = dw.change > 0 ? `+${dw.change}kg` : (dw.change < 0 ? `${dw.change}kg` : "—");
  const pinTxt = day.date.slice(8); // day number
  const weekEn = dayNames[day.weekday] || "";
  const colorCls = pinColors[idx % 3];

  // Diet
  let dietHtml = "";
  day.diet.forEach(meal => {
    const meta = mealMeta[meal.meal] || { icon:"🍽️", cls:"snack" };
    let mealSum = 0;
    let foods = "";
    meal.items.forEach(item => {
      mealSum += item.kcal;
      foods += `<div class="food-line"><span class="f-name">${item.name}<span class="f-port">${item.portion}</span></span><span class="f-kcal">${item.kcal}</span></div>`;
    });
    dietHtml += `
      <div class="meal">
        <div class="meal-rail">
          <div class="m-dot ${meta.cls}">${meta.icon}</div>
          <div class="m-line"></div>
        </div>
        <div class="meal-info">
          <div class="meal-name">${meal.meal}<span class="m-time">${meal.time}</span><span class="m-sum">${mealSum} kcal</span></div>
          ${foods}
        </div>
      </div>`;
  });

  // Nutrition
  const s = day.summary;
  const nutriHtml = `
    <div class="nutri">
      <div class="nutri-cell"><div class="n-val total">${s.totalKcal}</div><div class="n-label">KCAL</div></div>
      <div class="nutri-cell"><div class="n-val p">${s.protein}</div><div class="n-label">蛋白</div></div>
      <div class="nutri-cell"><div class="n-val c">${s.carbs}</div><div class="n-label">碳水</div></div>
      <div class="nutri-cell"><div class="n-val f">${s.fat}</div><div class="n-label">脂肪</div></div>
    </div>`;

  // Advice
  const a = day.advice;
  const advHtml = `
    <div class="adv-card">
      <div class="adv-good">${a.good.map(g => `<span class="g-tag">✓ ${g}</span>`).join("")}</div>
      ${a.tips.map(t => `<div class="adv-tip"><div class="at-dot"></div><div class="at-txt">${t}</div></div>`).join("")}
      <div class="adv-final">📌 ${a.overall}</div>
    </div>`;

  const entry = document.createElement("div");
  entry.className = `entry ${colorCls}`;
  entry.innerHTML = `
    <div class="date-pin">${pinTxt}</div>
    <div class="page-card">
      <div class="pc-head">
        <div>
          <div class="pc-date">${day.date}</div>
          <div class="pc-week">${day.weekday} · ${weekEn}</div>
        </div>
        <div class="pc-weight">
          <span class="pc-w-num">${wNum}</span><span class="pc-w-unit">kg</span>
          <span class="pc-w-chg ${cCls}">${cTxt}</span>
        </div>
      </div>
      <div class="pc-body">
        <div class="sec">
          <div class="sec-tag t-w"><span class="st-line"></span>WEIGHT · 体重</div>
          <div class="w-row">
            <div class="w-box"><div class="wb-ico">🌅</div><div class="wb-label">早上</div><div class="wb-val">${dw.morning || "--"}<span class="u">kg</span></div></div>
            <div class="w-box"><div class="wb-ico">🌙</div><div class="wb-label">晚上</div><div class="wb-val">${dw.evening || "--"}<span class="u">kg</span></div></div>
          </div>
          ${dw.note ? `<div class="w-note">💬 ${dw.note}</div>` : ""}
        </div>
        <div class="sec">
          <div class="sec-tag t-d"><span class="st-line"></span>MEALS · 饮食</div>
          ${nutriHtml}
          ${dietHtml}
        </div>
        <div class="sec">
          <div class="sec-tag t-a"><span class="st-line"></span>NOTES · 建议</div>
          ${advHtml}
        </div>
      </div>
    </div>`;
  journal.appendChild(entry);
});

// Scroll animations
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("visible"); });
}, { threshold: 0.08 });
document.querySelectorAll(".entry").forEach(el => io.observe(el));

// Progress bar
window.addEventListener("scroll", () => {
  const h = document.documentElement;
  const pct = (h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100;
  document.getElementById("progress").style.width = pct + "%";
}, { passive: true });

function scrollTop() {
  window.scrollTo({ top: 0, behavior: "smooth" });
  showToast("回到顶部 ☝️");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1500);
}
</script>
</body>
</html>
